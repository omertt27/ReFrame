<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReFrame</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #0b0b0d;
        color: #f5f5f5;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        border-bottom: 1px solid #222;
        background: #111113;
      }
      .undo-controls {
        display: flex;
        gap: 6px;
      }
      .undo-controls button {
        background: #1c1c1f;
        color: #d0d0d3;
        border: 1px solid #2a2a2e;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .undo-controls button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .layout {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #tree {
        width: 220px;
        flex: none;
        overflow: auto;
        background: #111113;
        border-right: 1px solid #222;
        padding: 12px;
      }
      #canvas {
        flex: 1;
        min-width: 0;
        display: flex;
      }
      iframe {
        flex: 1;
        border: 0;
        background: #fff;
      }
      #properties {
        width: 320px;
        flex: none;
        overflow: auto;
        background: #111113;
        border-left: 1px solid #222;
        padding: 16px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a8a90;
        margin: 0 0 10px;
      }
      .page-group {
        margin-bottom: 14px;
      }
      .page-label {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 6px;
        color: #d0d0d3;
      }
      .section-row {
        padding: 5px 6px 5px 20px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        color: #b0b0b4;
      }
      .section-row:hover {
        background: #1a1a1d;
        color: #f5f5f5;
      }
      .section-row.active {
        background: rgba(244, 163, 64, 0.12);
        color: #f4a340;
      }
      .empty {
        color: #6b6b70;
        font-size: 13px;
        padding: 8px;
      }
      .selection-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .selection-meta {
        font-size: 12px;
        color: #8a8a90;
        margin-bottom: 16px;
      }
      .breadcrumb {
        font-size: 11px;
        color: #6b6b70;
        margin-bottom: 16px;
        word-break: break-word;
      }
      .breadcrumb .crumb {
        color: #b0b0b4;
      }
      .breadcrumb .crumb.leaf {
        color: #f4a340;
      }
      .breadcrumb .sep {
        margin: 0 4px;
      }
      .scope {
        margin-bottom: 20px;
        border: 1px solid #222;
        border-radius: 8px;
        padding: 10px;
      }
      .scope label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 4px 0;
        cursor: pointer;
      }
      .scope label.disabled {
        color: #55555a;
        cursor: default;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #8a8a90;
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        background: #0b0b0d;
        border: 1px solid #2a2a2e;
        color: #f5f5f5;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
      }
      .field input:disabled {
        opacity: 0.35;
      }
      .field textarea {
        width: 100%;
        background: #0b0b0d;
        border: 1px solid #2a2a2e;
        color: #f5f5f5;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
        min-height: 60px;
      }
      .field textarea:disabled {
        opacity: 0.35;
      }
      .field .unavailable {
        font-size: 11px;
        color: #6b6b70;
        margin-top: 4px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        background: #17171a;
        padding: 10px;
        border-radius: 8px;
        margin: 0;
      }
      .change-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
      .change-row:hover {
        background: #1a1a1d;
      }
      .change-row .desc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .change-row .file {
        color: #6b6b70;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <span>ReFrame</span>
        <div class="undo-controls">
          <button id="btn-undo" disabled title="Cmd/Ctrl+Z">Undo</button>
          <button id="btn-redo" disabled title="Cmd/Ctrl+Shift+Z">Redo</button>
        </div>
      </header>
      <div class="layout">
        <div id="tree">
          <h2>Pages</h2>
          <div id="tree-body"></div>
        </div>
        <div id="canvas">
          <iframe id="target" src="__PROXY_URL__"></iframe>
        </div>
        <div id="properties">
          <h2>Properties</h2>
          <div id="properties-body">
            <div class="empty">Click something in the canvas, or select it from Pages.</div>
          </div>
          <h2 style="margin-top: 24px">Last diff</h2>
          <pre id="diff">(no edit yet)</pre>
          <h2 style="margin-top: 24px">Changes</h2>
          <div id="changes-body">
            <div class="empty">No edits yet.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var current = null; // { component, route, usageCount, kind, availableInstance }
      var scope = "all";

      function loadTree() {
        fetch("/__reframe/tree")
          .then(function (r) {
            return r.json();
          })
          .then(function (pages) {
            var body = document.getElementById("tree-body");
            body.innerHTML = pages
              .map(function (p) {
                var sections = p.sections
                  .map(function (name) {
                    return (
                      '<div class="section-row" data-route="' +
                      p.route +
                      '" data-component="' +
                      name +
                      '">' +
                      name +
                      "</div>"
                    );
                  })
                  .join("");
                return '<div class="page-group"><div class="page-label">' + p.label + "</div>" + sections + "</div>";
              })
              .join("");

            Array.prototype.forEach.call(body.querySelectorAll(".section-row"), function (el) {
              el.addEventListener("click", function () {
                selectFromTree(el.getAttribute("data-route"), el.getAttribute("data-component"));
              });
            });
          });
      }

      function selectFromTree(route, component) {
        var iframe = document.getElementById("target");
        Array.prototype.forEach.call(document.querySelectorAll(".section-row"), function (el) {
          el.classList.toggle("active", el.getAttribute("data-route") === route && el.getAttribute("data-component") === component);
        });

        var proxyOrigin = new URL(iframe.src).origin;
        var currentPath = new URL(iframe.src).pathname;
        if (currentPath === route) {
          resolveSelection(component, route);
        } else {
          iframe.src = proxyOrigin + route;
          setTimeout(function () {
            resolveSelection(component, route);
          }, 900);
        }
      }

      // `path`/`elementTag` are only present when the click came from inside
      // a component (a nested JSX element), not from the Pages tree — an
      // empty/omitted path means "the component's own root", same meaning
      // as before this ever existed. `computedStyle` (the browser's actual
      // rendered values for the clicked element, from preload.js) is
      // likewise only present for a real click — a Pages-tree selection has
      // no live DOM node to read it from yet, so the server-side external-
      // CSS cross-check simply has nothing to compare against there.
      function resolveSelection(component, route, path, elementTag, computedStyle) {
        var body = document.getElementById("properties-body");
        body.innerHTML = '<div class="empty">resolving ' + component + " ...</div>";
        fetch("/__reframe/resolve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: component,
            route: route,
            path: path || [],
            elementTag: elementTag || null,
            computedStyle: computedStyle || null,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            result.component = component;
            result.route = route;
            renderProperties(result);
          })
          .catch(function (err) {
            body.innerHTML = '<div class="empty">error: ' + err + "</div>";
          });
      }

      function propertyField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.px !== null ? prop.px : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + prop.reason + "</div>";
        // Backend is shown next to the label — transparency about which
        // representation (Tailwind vs inline style) an edit will land in,
        // never silently rewritten from what the author already chose.
        var backendLabel = prop && prop.backend ? " · " + prop.backend : "";
        return (
          '<div class="field">' +
          "<label>" +
          label +
          backendLabel +
          "</label>" +
          '<input type="number" data-property="' +
          key +
          '" data-backend="' +
          (prop && prop.backend ? prop.backend : "") +
          '" value="' +
          value +
          '" placeholder="—" ' +
          (disabled ? "disabled" : "") +
          " />" +
          note +
          "</div>"
        );
      }

      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // A plain text input, not a native <input type=color> — that widget
      // only accepts 6-digit hex and can't represent "var(--accent)" or a
      // named color, and a preview swatch can't resolve what a CSS variable
      // evaluates to from this document anyway (it's defined in the target
      // page's own stylesheet). Shows the raw current value verbatim,
      // whatever form it's already in — same "preserve the author's
      // representation" principle as the dimension fields.
      function colorField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.value !== null ? prop.value : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + prop.reason + "</div>";
        var backendLabel = prop && prop.backend ? " · " + prop.backend : "";
        return (
          '<div class="field">' +
          "<label>" +
          label +
          backendLabel +
          "</label>" +
          '<input type="text" data-property="' +
          key +
          '" data-value-kind="color" data-backend="' +
          (prop && prop.backend ? prop.backend : "") +
          '" value="' +
          escapeHtml(value) +
          '" placeholder="e.g. #3B82F6 or var(--accent)" ' +
          (disabled ? "disabled" : "") +
          " />" +
          note +
          "</div>"
        );
      }

      // Content is shown above the style properties — for a "click it, change
      // it" editor, the text itself is the primary edit most people reach
      // for, not padding. Only plain single-text-node elements are editable
      // here (see text-ir.ts) — mixed text+markup or `{expression}` content
      // shows the specific unsupported reason instead of a guess.
      function textField(text) {
        if (!text || !text.editable) {
          var reason = text ? text.reason : "no editable text here";
          return '<div class="field"><label>Content</label><div class="unavailable">' + reason + "</div></div>";
        }
        return (
          '<div class="field">' +
          "<label>Content</label>" +
          '<textarea data-text-field rows="3">' +
          escapeHtml(text.value) +
          "</textarea>" +
          "</div>"
        );
      }

      function renderProperties(result) {
        var body = document.getElementById("properties-body");
        if (!result.ok) {
          body.innerHTML = '<div class="empty">' + result.error + "</div>";
          return;
        }

        var path = result.path || [];
        var isNested = path.length > 0;

        current = {
          component: result.component,
          route: result.route,
          usageCount: result.usageCount,
          availableInstance: result.kind === "usage",
          path: path,
        };
        scope = "all";

        var shared = result.usageCount > 1;
        var metaText = shared
          ? "Shared component · " + result.usageCount + " usages"
          : result.usageCount === 1
            ? "1 usage"
            : "Page component";
        var scopeDisabledAttr = current.availableInstance ? "" : "disabled";
        var noteHtml = result.note ? '<div class="unavailable" style="margin: -8px 0 16px">' + result.note + "</div>" : "";

        // A nested element inside a component's render — not a new component,
        // just a specific JSX node — gets a breadcrumb (its position within
        // the render) instead of the "shared component" framing, and the
        // instance/all-instances scope choice doesn't apply: a nested
        // element's own className already resolves to exactly one branch for
        // whichever component instance was clicked (see host.ts's mutate
        // handler), there is nothing else to choose between.
        var breadcrumbHtml = "";
        var scopeHtml = "";
        if (isNested && result.breadcrumb) {
          breadcrumbHtml =
            '<div class="breadcrumb">' +
            result.breadcrumb
              .map(function (name, i) {
                var isLeaf = i === result.breadcrumb.length - 1;
                return '<span class="crumb' + (isLeaf ? " leaf" : "") + '">' + name + "</span>";
              })
              .join('<span class="sep">→</span>') +
            "</div>";
        } else {
          scopeHtml =
            '<div class="scope">' +
            '<label><input type="radio" name="scope" value="all" checked /> All instances</label>' +
            '<label class="' +
            (current.availableInstance ? "" : "disabled") +
            '"><input type="radio" name="scope" value="instance" ' +
            scopeDisabledAttr +
            " /> This instance</label>" +
            "</div>";
        }

        var propsHtml = "(no editable properties here)";
        var hiddenStyleNote = "";
        if (result.properties && result.properties.editable) {
          propsHtml = Object.keys(result.properties.values)
            .map(function (key) {
              var labels = {
                height: "Height",
                width: "Width",
                padding: "Padding",
                textColor: "Text color",
                backgroundColor: "Background color",
                fontSize: "Font size",
                fontWeight: "Font weight",
                lineHeight: "Line height",
                letterSpacing: "Letter spacing",
              };
              var prop = result.properties.values[key];
              var label = labels[key] || key;
              return prop && prop.kind === "color" ? colorField(key, label, prop) : propertyField(key, label, prop);
            })
            .join("");
          // Never guess which property a computed/bracket style key (e.g. a
          // `key as any` TS cast) would have mapped to — just say plainly
          // that this element's style object has more in it than what's
          // shown, rather than silently pretending those properties don't
          // exist at all.
          if (result.properties.hasHiddenStyleProperties) {
            hiddenStyleNote =
              '<div class="unavailable" style="margin-bottom: 14px">This element\'s style has at least one property ReFrame can\'t read (a computed/bracket key) — not shown above, not touched by any edit here.</div>';
          }
        } else if (result.properties) {
          propsHtml = '<div class="unavailable">' + result.properties.reason + "</div>";
        }

        body.innerHTML =
          '<div class="selection-title">' +
          result.component +
          "</div>" +
          '<div class="selection-meta">' +
          metaText +
          "</div>" +
          breadcrumbHtml +
          noteHtml +
          textField(result.text) +
          scopeHtml +
          hiddenStyleNote +
          propsHtml;

        Array.prototype.forEach.call(document.querySelectorAll('input[name="scope"]'), function (el) {
          el.addEventListener("change", function () {
            scope = el.value;
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("input[data-property]"), function (el) {
          el.addEventListener("change", function () {
            if (el.getAttribute("data-value-kind") === "color") {
              mutateColor(el.getAttribute("data-property"), el.value, el.getAttribute("data-backend"));
            } else {
              mutate(el.getAttribute("data-property"), Number(el.value), el.getAttribute("data-backend"));
            }
          });
        });
        var textEl = document.querySelector("textarea[data-text-field]");
        if (textEl) {
          textEl.addEventListener("change", function () {
            mutateText(textEl.value);
          });
        }
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.source !== "reframe-preload") return;

        if (data.type === "reorder") {
          var diffEl = document.getElementById("diff");
          diffEl.textContent = "reordering (" + data.fromName + " -> " + data.toName + ") ...";
          fetch("/__reframe/reorder", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              route: data.route,
              fromIndex: data.fromIndex,
              toIndex: data.toIndex,
              fromName: data.fromName,
              toName: data.toName,
            }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (result) {
              diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
              if (result.ok) refreshHistory();
            })
            .catch(function (err) {
              diffEl.textContent = "error: " + err;
            });
          return;
        }

        if (data.type === "computed-style-result") {
          var pending = pendingVerifications[data.requestId];
          if (pending) {
            delete pendingVerifications[data.requestId];
            pending({ matches: data.matches, actual: data.actual });
          }
          return;
        }

        if (data.type !== "select") return;
        resolveSelection(data.component, data.route, data.path, data.elementTag, data.computedStyle);
      });

      // Post-write half of the external-CSS safety net (see host.ts's
      // crossCheckAgainstComputed for the pre-write half, and project
      // memory `reframe-stress-test-responsive-css` for why this exists —
      // ReFrame previously reported a padding edit as successful while the
      // rendered page never changed). Asks preload.js to re-read the same
      // DOM node's computed style after giving HMR a moment to settle, and
      // compares it against the value the edit actually intended.
      var pendingVerifications = {};
      var verifyRequestCounter = 0;
      function verifyComputedStyleOnce(property, kind, expected) {
        return new Promise(function (resolve) {
          var requestId = "v" + verifyRequestCounter++;
          var timeoutId = setTimeout(function () {
            delete pendingVerifications[requestId];
            resolve({ matches: null, actual: null }); // no reply in time — don't guess a failure
          }, 3000);
          pendingVerifications[requestId] = function (result) {
            clearTimeout(timeoutId);
            resolve(result);
          };
          var iframe = document.getElementById("target");
          iframe.contentWindow.postMessage(
            { type: "reframe-verify-computed-style", requestId: requestId, property: property, kind: kind, expected: expected },
            "*",
          );
        });
      }

      // A single check isn't reliable on its own: verified live that a
      // brand-new Tailwind utility class (one that wasn't already used
      // elsewhere in the target project) can take noticeably longer than
      // React's own Fast Refresh to actually apply — Tailwind's dev-mode
      // JIT compiler has to notice the new class and inject its CSS
      // separately, which isn't on the same clock as HMR. A single ~700ms
      // check produced a false "didn't apply" warning for exactly that
      // case even though the edit was completely correct. Retrying a few
      // times with growing delays before concluding "mismatch" avoids
      // crying wolf on a slow-but-healthy edit while still catching a
      // genuine, persistent mismatch (which stays mismatched no matter how
      // many times it's re-checked).
      function verifyComputedStyleWithRetry(property, kind, expected, delays) {
        var attempt = 0;
        function tryOnce() {
          return verifyComputedStyleOnce(property, kind, expected).then(function (result) {
            if (result.matches !== false || attempt >= delays.length) return result;
            var delay = delays[attempt];
            attempt++;
            return new Promise(function (resolve) {
              setTimeout(function () {
                resolve(tryOnce());
              }, delay);
            });
          });
        }
        return tryOnce();
      }

      function appendVerificationWarning(diffEl, property, expected, kind, verifyResult) {
        if (verifyResult.matches !== false) return; // true: confirmed applied. null: couldn't verify, say nothing rather than guess.
        diffEl.textContent +=
          "\n\n⚠ Written to source, but the page didn't render the change — \"" +
          property +
          '" still shows ' +
          verifyResult.actual +
          " instead of the expected " +
          expected +
          (kind === "dimension" ? "px" : "") +
          ". This property may be controlled by something ReFrame can't see (external CSS, specificity, !important). The source change is saved — you may want to undo it.";
      }

      function mutate(property, px, backend) {
        if (!current || Number.isNaN(px)) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying " + property + " = " + px + "px (" + scope + ", " + backend + ") ...";
        fetch("/__reframe/mutate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            scope: scope,
            property: property,
            px: px,
            backend: backend,
            path: current.path || [],
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) {
              refreshHistory();
              setTimeout(function () {
                verifyComputedStyleWithRetry(property, "dimension", px, [800, 1500]).then(function (verifyResult) {
                  appendVerificationWarning(diffEl, property, px, "dimension", verifyResult);
                });
              }, 700);
            }
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      function mutateColor(property, value, backend) {
        if (!current) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying " + property + " = " + value + " (" + backend + ") ...";
        fetch("/__reframe/mutate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            scope: scope,
            property: property,
            value: value,
            backend: backend,
            path: current.path || [],
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) {
              refreshHistory();
              setTimeout(function () {
                verifyComputedStyleWithRetry(property, "color", value, [800, 1500]).then(function (verifyResult) {
                  appendVerificationWarning(diffEl, property, value, "color", verifyResult);
                });
              }, 700);
            }
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      function mutateText(value) {
        if (!current) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying text edit ...";
        fetch("/__reframe/mutate-text", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            path: current.path || [],
            value: value,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) refreshHistory();
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      function refreshHistory() {
        fetch("/__reframe/history")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            document.getElementById("btn-undo").disabled = data.history.length === 0;
            document.getElementById("btn-redo").disabled = !data.canRedo;

            var body = document.getElementById("changes-body");
            if (data.history.length === 0) {
              body.innerHTML = '<div class="empty">No edits yet.</div>';
              return;
            }
            body.innerHTML = data.history
              .slice()
              .reverse()
              .map(function (h) {
                return (
                  '<div class="change-row"><div><div class="desc">' +
                  h.description +
                  '</div><div class="file">' +
                  h.filePath +
                  "</div></div></div>"
                );
              })
              .join("");
          });
      }

      function undoOrRedo(kind) {
        fetch("/__reframe/" + kind, { method: "POST" })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            var diffEl = document.getElementById("diff");
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            refreshHistory();
            if (result.ok && current) resolveSelection(current.component, current.route, current.path);
          });
      }

      document.getElementById("btn-undo").addEventListener("click", function () {
        undoOrRedo("undo");
      });
      document.getElementById("btn-redo").addEventListener("click", function () {
        undoOrRedo("redo");
      });
      window.addEventListener("keydown", function (event) {
        var mod = event.metaKey || event.ctrlKey;
        if (!mod || event.key.toLowerCase() !== "z") return;
        event.preventDefault();
        undoOrRedo(event.shiftKey ? "redo" : "undo");
      });

      loadTree();
      refreshHistory();
    </script>
  </body>
</html>
