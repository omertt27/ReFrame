<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReFrame</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #0b0b0d;
        color: #f5f5f5;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        border-bottom: 1px solid #222;
        background: #111113;
      }
      .layout {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #components {
        width: 220px;
        flex: none;
        overflow: auto;
        background: #111113;
        border-right: 1px solid #222;
        padding: 12px;
      }
      #canvas {
        flex: 1;
        min-width: 0;
        display: flex;
      }
      iframe {
        flex: 1;
        border: 0;
        background: #fff;
      }
      #properties {
        width: 320px;
        flex: none;
        overflow: auto;
        background: #111113;
        border-left: 1px solid #222;
        padding: 16px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a8a90;
        margin: 0 0 10px;
      }
      .component-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 13px;
      }
      .component-row .count {
        color: #6b6b70;
        font-size: 11px;
      }
      .empty {
        color: #6b6b70;
        font-size: 13px;
        padding: 8px;
      }
      .selection-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .selection-meta {
        font-size: 12px;
        color: #8a8a90;
        margin-bottom: 16px;
      }
      .scope {
        margin-bottom: 20px;
        border: 1px solid #222;
        border-radius: 8px;
        padding: 10px;
      }
      .scope label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 4px 0;
        cursor: pointer;
      }
      .scope label.disabled {
        color: #55555a;
        cursor: default;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #8a8a90;
        margin-bottom: 4px;
      }
      .field input {
        width: 100%;
        background: #0b0b0d;
        border: 1px solid #2a2a2e;
        color: #f5f5f5;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
      }
      .field input:disabled {
        opacity: 0.35;
      }
      .field .unavailable {
        font-size: 11px;
        color: #6b6b70;
        margin-top: 4px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
        background: #17171a;
        padding: 10px;
        border-radius: 8px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>ReFrame</header>
      <div class="layout">
        <div id="components">
          <h2>Components</h2>
          <div id="component-list"></div>
        </div>
        <div id="canvas">
          <iframe id="target" src="__PROXY_URL__"></iframe>
        </div>
        <div id="properties">
          <h2>Properties</h2>
          <div id="properties-body">
            <div class="empty">Click something in the canvas.</div>
          </div>
          <h2 style="margin-top: 24px">Diff</h2>
          <pre id="diff">(no edit yet)</pre>
        </div>
      </div>
    </div>

    <script>
      var current = null; // { component, route, usageCount, kind, availableInstance }
      var scope = "all";

      fetch("/__reframe/components")
        .then(function (r) {
          return r.json();
        })
        .then(function (list) {
          var el = document.getElementById("component-list");
          el.innerHTML = list
            .map(function (c) {
              return (
                '<div class="component-row"><span>' +
                c.name +
                '</span><span class="count">' +
                c.usageCount +
                "×</span></div>"
              );
            })
            .join("");
        });

      function propertyField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.px !== null ? prop.px : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + prop.reason + "</div>";
        return (
          '<div class="field">' +
          "<label>" +
          label +
          "</label>" +
          '<input type="number" data-property="' +
          key +
          '" value="' +
          value +
          '" placeholder="—" ' +
          (disabled ? "disabled" : "") +
          " />" +
          note +
          "</div>"
        );
      }

      function renderProperties(result) {
        var body = document.getElementById("properties-body");
        if (!result.ok) {
          body.innerHTML = '<div class="empty">' + result.error + "</div>";
          return;
        }

        current = {
          component: result.component,
          route: result.route,
          usageCount: result.usageCount,
          availableInstance: result.kind === "usage",
        };
        scope = "all";

        var plural = result.usageCount === 1 ? "page" : "pages";
        var scopeDisabledAttr = current.availableInstance ? "" : "disabled";
        var noteHtml = result.note ? '<div class="unavailable" style="margin: -8px 0 16px">' + result.note + "</div>" : "";

        var propsHtml = "(no editable properties here)";
        if (result.properties && result.properties.editable) {
          propsHtml = Object.keys(result.properties.values)
            .map(function (key) {
              var labels = { height: "Height", padding: "Padding" };
              return propertyField(key, labels[key] || key, result.properties.values[key]);
            })
            .join("");
        } else if (result.properties) {
          propsHtml = '<div class="unavailable">' + result.properties.reason + "</div>";
        }

        body.innerHTML =
          '<div class="selection-title">' +
          result.component +
          "</div>" +
          '<div class="selection-meta">Used on ' +
          result.usageCount +
          " " +
          plural +
          "</div>" +
          noteHtml +
          '<div class="scope">' +
          '<label class="' +
          "" +
          '"><input type="radio" name="scope" value="all" checked /> All instances</label>' +
          '<label class="' +
          (current.availableInstance ? "" : "disabled") +
          '"><input type="radio" name="scope" value="instance" ' +
          scopeDisabledAttr +
          " /> This instance</label>" +
          "</div>" +
          propsHtml;

        Array.prototype.forEach.call(document.querySelectorAll('input[name="scope"]'), function (el) {
          el.addEventListener("change", function () {
            scope = el.value;
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll("input[data-property]"), function (el) {
          el.addEventListener("change", function () {
            mutate(el.getAttribute("data-property"), Number(el.value));
          });
        });
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.source !== "reframe-preload") return;

        if (data.type === "reorder") {
          var diffEl = document.getElementById("diff");
          diffEl.textContent = "reordering (" + data.fromIndex + " -> " + data.toIndex + ") ...";
          fetch("/__reframe/reorder", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ route: data.route, fromIndex: data.fromIndex, toIndex: data.toIndex }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (result) {
              diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            })
            .catch(function (err) {
              diffEl.textContent = "error: " + err;
            });
          return;
        }

        if (data.type !== "select") return;
        var body = document.getElementById("properties-body");
        body.innerHTML = '<div class="empty">resolving ' + data.component + " ...</div>";

        fetch("/__reframe/resolve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ component: data.component, route: data.route }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            result.component = data.component;
            result.route = data.route;
            renderProperties(result);
          })
          .catch(function (err) {
            body.innerHTML = '<div class="empty">error: ' + err + "</div>";
          });
      });

      function mutate(property, px) {
        if (!current || Number.isNaN(px)) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying " + property + " = " + px + "px (" + scope + ") ...";
        fetch("/__reframe/mutate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            scope: scope,
            property: property,
            px: px,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }
    </script>
  </body>
</html>
