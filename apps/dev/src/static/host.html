      // A round preview of the CURRENT color, not a labeled icon — clicking
      // it opens a ONE-field popup directly. `var(--x)`/named colors can't
      // be resolved into a real swatch color from this document (the
      // variable is defined in the TARGET page's own stylesheet) — shown
      // as an empty/checkerboard swatch in that case rather than guessing
      // a color, same "don't guess" bar as everywhere else in this file.
      function renderColorSwatch(key, title) {
        var prop = current.properties.values[key];
        var value = prop && prop.available ? prop.value : null;
        var isHex = value && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value);
        var style = isHex ? ' style="background:' + value + '"' : "";
        return (
          '<button class="toolbar-swatch' +
          (isHex ? "" : " empty") +
          '" data-swatch="' +
          key +
          '" title="' +
          title +
          '"' +
          style +
          "></button>"
        );
      }

      function updateCanvasToolbar() {
        var toolbar = document.getElementById("canvas-toolbar");
        closeCanvasPopup();
        if (!lastRect || !current) {
          toolbar.style.display = "none";
          return;
        }
        var canEditText = !!(current.text && current.text.editable);
        var hasFontSize = keyAvailable("fontSize");
        var hasTextColor = keyAvailable("textColor");
        var hasBgColor = keyAvailable("backgroundColor");
        var hasWidth = keyAvailable("width");
        var hasHeight = keyAvailable("height");
        var hasSize = hasWidth || hasHeight;
        var hasMore = MORE_KEYS.some(keyAvailable);
        var canDelete = canDeleteCurrent();
        var canDuplicate = canDuplicateCurrent();

        // The drag handles are rendered once, statically, in the HTML shell
        // (they follow the selection rect, not the toolbar's own re-render)
        // — but a handle that's visible and draggable while doing NOTHING
        // on release (because this element has no editable width/height at
        // all, common on real PrivaPDF pages with no explicit size classes)
        // is exactly the "fake affordance" this project refuses elsewhere.
        // Synced here, every time selection resolves, same as every other
        // *Available flag on this page.
        var handleE = document.querySelector(".handle-e");
        var handleS = document.querySelector(".handle-s");
        var handleSE = document.querySelector(".handle-se");
        if (handleE) handleE.style.display = hasWidth ? "" : "none";
        if (handleS) handleS.style.display = hasHeight ? "" : "none";
        if (handleSE) handleSE.style.display = hasSize ? "" : "none";

        if (!canEditText && !hasFontSize && !hasTextColor && !hasBgColor && !hasSize && !hasMore && !canDelete && !canDuplicate) {
          toolbar.style.display = "none";
          return;
        }

        var parts = [];
        if (canEditText) {
          parts.push('<button class="toolbar-btn" id="toolbar-edit-text-btn" title="Edit text"><span class="icon">✎</span></button>');
        }
        if (hasFontSize) {
          var fsProp = current.properties.values.fontSize;
          var fsValue = fsProp.available && fsProp.px !== null ? fsProp.px : "—";
          parts.push(
            '<div class="toolbar-stepper" title="Font size">' +
              '<button class="stepper-btn" data-step="-1">–</button>' +
              '<span class="stepper-value" id="toolbar-fontsize-value">' +
              fsValue +
              "</span>" +
              '<button class="stepper-btn" data-step="1">+</button>' +
              "</div>",
          );
        }
        if (hasTextColor) parts.push(renderColorSwatch("textColor", "Text color"));
        if (hasBgColor) parts.push(renderColorSwatch("backgroundColor", "Background color"));
        if (hasSize) {
          parts.push('<button class="toolbar-btn" id="toolbar-size-btn" title="Width &amp; height"><span class="icon">⤢</span></button>');
        }
        if ((canEditText || hasFontSize || hasTextColor || hasBgColor || hasSize) && hasMore) parts.push('<div class="toolbar-sep"></div>');
        if (hasMore) parts.push('<button class="toolbar-btn" id="toolbar-more-btn" title="More properties"><span class="icon">⋯</span></button>');
        if (canDuplicate) {
          parts.push('<button class="toolbar-btn" id="toolbar-duplicate-btn" title="Duplicate this element"><span class="icon">⧉</span></button>');
        }
        if (canDelete) {
          parts.push('<button class="toolbar-btn toolbar-btn-delete" id="toolbar-delete-btn" title="Delete this element"><span class="icon">🗑</span></button>');
        }
        toolbar.innerHTML = parts.join("");

        var offset = iframeOffset();
        var top = lastRect.y - 44;
        if (top < 4) top = lastRect.y + lastRect.height + 8;
        toolbar.style.left = lastRect.x + offset.x + "px";
        toolbar.style.top = top + offset.y + "px";
        toolbar.style.display = "flex";

        var editTextBtn = document.getElementById("toolbar-edit-text-btn");
        if (editTextBtn) {
          editTextBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            closeCanvasPopup();
            postToFrame({ type: "reframe-enter-text-edit" });
          });
        }
        Array.prototype.forEach.call(toolbar.querySelectorAll(".stepper-btn"), function (btn) {
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            stepFontSize(Number(btn.getAttribute("data-step")));
          });
        });
        Array.prototype.forEach.call(toolbar.querySelectorAll(".toolbar-swatch"), function (btn) {
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            toggleCanvasPopup(btn.getAttribute("data-swatch"), btn);
          });
        });
        var sizeBtn = document.getElementById("toolbar-size-btn");
        if (sizeBtn) {
          sizeBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            toggleCanvasPopup("size", sizeBtn);
          });
        }
        var moreBtn = document.getElementById("toolbar-more-btn");
        if (moreBtn) {
          moreBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            toggleCanvasPopup("more", moreBtn);
          });
        }
        var duplicateBtn = document.getElementById("toolbar-duplicate-btn");
        if (duplicateBtn) {
          duplicateBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            duplicateSelectedElement();
          });
        }
        var deleteBtn = document.getElementById("toolbar-delete-btn");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            deleteSelectedElement();
          });
        }
      }

      document.addEventListener("click", function (event) {
        if (!openPopupGroup) return;
        var popup = document.getElementById("canvas-popup");
        var toolbar = document.getElementById("canvas-toolbar");
        if (!popup.contains(event.target) && !toolbar.contains(event.target)) closeCanvasPopup();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && openPopupGroup) closeCanvasPopup();
      });

      // Renders one group's fields as HTML — shared by the full panel
      // (grouped under a heading) and the floating canvas popup (one
      // group's fields alone, no heading needed since the toolbar button
      // that opened it already said what this is).
      function renderGroupFields(keys) {
        if (!current || !current.properties || !current.properties.editable) return "";
        var values = current.properties.values;
        return keys
          .filter(function (key) {
            return Object.prototype.hasOwnProperty.call(values, key);
          })
          .map(function (key) {
            var prop = values[key];
            var label = FIELD_LABELS[key] || key;
            if (prop && prop.kind === "color") return colorField(key, label, prop);
            if (prop && prop.kind === "text") return fontFamilyField(key, label, prop);
            return propertyField(key, label, prop);
          })
          .join("");
      }

      // Attaches the change listeners any rendered field markup needs,
      // scoped to one container — called after EVERY render of field
      // markup (the main panel, and separately each time a canvas popup
      // renders), never globally, so the main panel's already-wired inputs
      // never get a second listener stacked on top when a popup renders.
      function wireFieldInputs(container) {
        Array.prototype.forEach.call(container.querySelectorAll("input[data-property]"), function (el) {
          el.addEventListener("change", function () {
            if (el.getAttribute("data-value-kind") === "color") {
              mutateColor(el.getAttribute("data-property"), el.value, el.getAttribute("data-backend"));
              var picker = container.querySelector('.color-swatch-input[data-color-for="' + el.getAttribute("data-property") + '"]');
              if (picker && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(el.value)) {
                picker.value = el.value.length === 4 ? expandHex3(el.value) : el.value;
                picker.classList.remove("swatch-unresolved");
                picker.removeAttribute("title");
              }
            } else {
              mutate(el.getAttribute("data-property"), Number(el.value), el.getAttribute("data-backend"));
            }
          });
        });
        Array.prototype.forEach.call(container.querySelectorAll(".number-input-row .stepper-btn"), function (btn) {
          btn.addEventListener("click", function (event) {
            event.stopPropagation();
            var key = btn.getAttribute("data-step-for");
            var dir = Number(btn.getAttribute("data-step-dir"));
            var input = container.querySelector('input[data-property="' + key + '"]');
            if (!input) return;
            var cfg = stepConfigFor(key);
            var base = input.value === "" ? 0 : Number(input.value);
            var next = base + dir * cfg.step;
            if (cfg.min !== undefined && cfg.min !== null) next = Math.max(cfg.min, next);
            if (cfg.max !== undefined && cfg.max !== null) next = Math.min(cfg.max, next);
            next = Number(next.toFixed(cfg.precision));
            input.value = next;
            mutate(key, next, input.getAttribute("data-backend"));
          });
        });
        Array.prototype.forEach.call(container.querySelectorAll(".color-swatch-input"), function (picker) {
          var key = picker.getAttribute("data-color-for");
          var textEl = container.querySelector('input[data-property="' + key + '"][data-value-kind="color"]');
          picker.addEventListener("input", function () {
            if (textEl) textEl.value = picker.value;
            picker.classList.remove("swatch-unresolved");
            picker.removeAttribute("title");
          });
          picker.addEventListener("change", function () {
            mutateColor(key, picker.value, textEl ? textEl.getAttribute("data-backend") : "");
          });
        });
        Array.prototype.forEach.call(container.querySelectorAll(".recent-color-swatch"), function (swatch) {
          var row = swatch.closest(".recent-colors");
          var key = row ? row.getAttribute("data-recent-for") : null;
          if (!key) return;
          var textEl = container.querySelector('input[data-property="' + key + '"][data-value-kind="color"]');
          var picker = container.querySelector('.color-swatch-input[data-color-for="' + key + '"]');
          swatch.addEventListener("click", function (event) {
            event.stopPropagation();
            var hex = swatch.getAttribute("data-recent-color");
            if (textEl) textEl.value = hex;
            if (picker) {
              picker.value = hex;
              picker.classList.remove("swatch-unresolved");
              picker.removeAttribute("title");
            }
            mutateColor(key, hex, textEl ? textEl.getAttribute("data-backend") : "");
          });
        });
        Array.prototype.forEach.call(container.querySelectorAll(".font-preset-select"), function (select) {
          var key = select.getAttribute("data-font-preset-for");
          var textEl = container.querySelector('input[data-property="' + key + '"][data-value-kind="color"]');
          select.addEventListener("change", function () {
            if (!select.value) return; // "Preset…" placeholder re-selected — no-op
            if (textEl) textEl.value = select.value;
            mutateColor(key, select.value, textEl ? textEl.getAttribute("data-backend") : "");
            select.value = ""; // back to placeholder — the text field above now shows the real current value
          });
        });
        var textEl2 = container.querySelector("textarea[data-text-field]");
        if (textEl2) {
          textEl2.addEventListener("change", function () {
            mutateText(textEl2.value);
          });
        }
      }

      function renderProperties(result) {
        var body = document.getElementById("properties-body");
        if (!result.ok) {
          body.innerHTML = '<div class="empty">' + result.error + "</div>";
          closeCanvasToolbar();
          return;
        }

        var path = result.path || [];
        var isNested = path.length > 0;

        current = {
          component: result.component,
          route: result.route,
          usageCount: result.usageCount,
          availableInstance: result.kind === "usage",
          scopeChoice: result.scopeChoice || null,
          path: path,
          properties: result.properties,
        };
        // Narrowest safe default: only broaden to "all" when there's no
        // specific usage to scope down to at all (current.availableInstance
        // false). When a scope choice is genuinely meaningful (see below)
        // the user opts into the wider blast radius explicitly rather than
        // it being silently pre-selected.
        scope = current.availableInstance ? "instance" : "all";
        clsxArgIndex = current.scopeChoice && current.scopeChoice.kind === "clsx" ? current.scopeChoice.defaultIndex : null;

        var shared = result.usageCount > 1;
        var metaText = shared ? "Used in " + result.usageCount + " places" : result.usageCount === 1 ? "1 usage" : "Page";
        var noteHtml = result.note ? '<div class="unavailable" style="margin: -8px 0 16px">' + humanizeReason(result.note) + "</div>" : "";

        // A nested element inside a component's render — not a new component,
        // just a specific JSX node — gets a breadcrumb (its position within
        // the render) instead of the "shared component" framing.
        var breadcrumbHtml = "";
        if (isNested && result.breadcrumb) {
          breadcrumbHtml =
            '<div class="breadcrumb">' +
            result.breadcrumb
              .map(function (name, i) {
                var isLeaf = i === result.breadcrumb.length - 1;
                return '<span class="crumb' + (isLeaf ? " leaf" : "") + '">' + name + "</span>";
              })
              .join('<span class="sep">→</span>') +
            "</div>";
        }

        // The instance/all-instances (or, for clsx, "which argument") choice
        // only ever changes anything when the root className is a
        // prop-driven ternary or a multi-argument clsx()/cn() call — a plain
        // string class, a single-arg clsx call, or any nested element always
        // resolves to exactly one target regardless of scope (see host.ts's
        // /__reframe/resolve handler, which only sends scopeChoice in those
        // two cases). Showing a scope UI any other time would be asking a
        // question the editor can already answer, so it only renders when
        // scopeChoice is present — and when it is, it's surfaced right here
        // in the main panel, not buried behind Advanced, since choosing it
        // wrong silently rewrites (or targets) a variant the user didn't
        // mean to touch.
        var scopeHtml = "";
        if (current.scopeChoice && current.scopeChoice.kind === "ternary") {
          scopeHtml =
            '<div class="scope">' +
            '<div class="scope-note">This element has two variants (based on <code>' +
            current.scopeChoice.propName +
            "</code>).</div>" +
            '<label><input type="radio" name="scope" value="instance" checked /> Just this one</label>' +
            '<label><input type="radio" name="scope" value="all" /> Both variants</label>' +
            "</div>";
        } else if (current.scopeChoice && current.scopeChoice.kind === "clsx") {
          scopeHtml =
            '<div class="scope">' +
            '<div class="scope-note">This element\'s style is built from ' +
            current.scopeChoice.args.length +
            " pieces — choose which one an edit changes.</div>" +
            current.scopeChoice.args
              .map(function (a) {
                var checked = a.index === current.scopeChoice.defaultIndex ? " checked" : "";
                return (
                  '<label><input type="radio" name="clsx-arg" value="' +
                  a.index +
                  '"' +
                  checked +
                  " /> " +
                  a.label +
                  (a.active === false ? " (not active now)" : "") +
                  "</label>"
                );
              })
              .join("") +
            "</div>";
        }

        // A friendly name for what's selected — "Heading", "Link" — not the
        // raw JSX tag or the component's own source name. For a nested
        // element the breadcrumb's last entry IS that tag/component name;
        // for a page's own root there's no tag to map from, so the
        // component's own (usually already-sensible) name is kept as-is.
        var leafName =
          isNested && result.breadcrumb && result.breadcrumb.length ? result.breadcrumb[result.breadcrumb.length - 1] : null;
        var titleText = leafName ? friendlyElementName(leafName) : result.component;

        current.text = result.text;
        current.title = titleText;

        var propsHtml = "";
        var hiddenStyleNote = "";
        if (result.properties && result.properties.editable) {
          propsHtml = PROPERTY_GROUPS.map(function (group) {
            var fieldsHtml = renderGroupFields(group.keys);
            if (!fieldsHtml) return "";
            return '<div class="prop-group"><div class="prop-group-title">' + group.title + "</div>" + fieldsHtml + "</div>";
          }).join("");
          // Never guess which property a computed/bracket style key (e.g. a
          // `key as any` TS cast) would have mapped to — just say plainly
          // that this element's style object has more in it than what's
          // shown, rather than silently pretending those properties don't
          // exist at all.
          if (result.properties.hasHiddenStyleProperties) {
            hiddenStyleNote =
              '<div class="unavailable" style="margin-bottom: 14px">This element has a few more style properties that aren\'t shown here and won\'t be touched by any edit.</div>';
          }
        } else if (result.properties) {
          propsHtml = '<div class="unavailable">' + humanizeReason(result.properties.reason) + "</div>";
        }
        if (!propsHtml) propsHtml = '<div class="empty">Nothing editable on this element yet.</div>';

        // Everything genuinely useful for understanding HOW an edit lands
        // (source component, usage count/scope, exact JSX path, backend
        // representation notes) — real information, just not what a "click
        // it, change it" editor should lead with. Collapsed by default,
        // one click away for anyone who wants it.
        var advancedHtml =
          '<details class="advanced"><summary>Advanced</summary>' +
          '<div class="selection-title">' +
          result.component +
          "</div>" +
          '<div class="selection-meta">' +
          metaText +
          "</div>" +
          breadcrumbHtml +
          "</details>";

        body.innerHTML =
          '<div class="selection-title">' +
          titleText +
          "</div>" +
          noteHtml +
          scopeHtml +
          textField(result.text) +
          hiddenStyleNote +
          propsHtml +
          advancedHtml;

        Array.prototype.forEach.call(document.querySelectorAll('input[name="scope"]'), function (el) {
          el.addEventListener("change", function () {
            scope = el.value;
          });
        });
        Array.prototype.forEach.call(document.querySelectorAll('input[name="clsx-arg"]'), function (el) {
          el.addEventListener("change", function () {
            clsxArgIndex = Number(el.value);
          });
        });
        wireFieldInputs(body);

        updateCanvasToolbar();
        updateResizeHandles();

        // preload.js's own double-click-to-edit-text listener lives inside
        // the target iframe and has no access to `current` — without this,
        // it only had a DOM-shape check (one text-node child) to decide
        // whether to engage contenteditable, which happily agrees for a
        // ternary like `{loading ? "..." : "Drop your PDF..."}` since it
        // renders as plain text at any given moment. That let a user type a
        // "successful-looking" edit that the server would then silently
        // reject on commit (text.editable false: "content is a dynamic
        // expression"), leaving stale, never-saved text sitting in the
        // canvas with no visible revert. Telling the iframe the real,
        // server-confirmed answer closes that gap at the source, the same
        // gate the toolbar's pencil button already uses.
        postToFrame({ type: "reframe-text-editable", editable: !!(current.text && current.text.editable) });
      }

      // A handle that's visible and looks draggable but silently does
      // nothing on release (startDrag already refuses when the property
      // isn't available) is exactly the "fake affordance" this model
      // avoids everywhere else — verified live that an inline `<em>`'s
      // resize handles otherwise sat there fully clickable, producing a
      // real write and a real "didn't render" warning on every single
      // drag, since CSS ignores width/height on an inline element
      // entirely. Hidden per-axis (the corner handle needs EITHER axis
      // available, since it can still drag whichever one works) rather
      // than all-or-nothing.
      function updateResizeHandles() {
        var wantsWidth = propAvailable("width");
        var wantsHeight = propAvailable("height");
        var eHandle = document.querySelector(".handle-e");
        var sHandle = document.querySelector(".handle-s");
        var seHandle = document.querySelector(".handle-se");
        if (eHandle) eHandle.style.display = wantsWidth ? "" : "none";
        if (sHandle) sHandle.style.display = wantsHeight ? "" : "none";
        if (seHandle) seHandle.style.display = wantsWidth || wantsHeight ? "" : "none";
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.source !== "reframe-preload") return;

        if (data.type === "reorder") {
          var diffEl = document.getElementById("diff");
          diffEl.textContent = "reordering (" + data.fromName + " -> " + data.toName + ") ...";
          fetch("/__reframe/reorder", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              route: data.route,
              fromIndex: data.fromIndex,
              toIndex: data.toIndex,
              insertBefore: data.insertBefore,
              fromName: data.fromName,
              toName: data.toName,
            }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (result) {
              diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
              if (result.ok) {
                refreshHistory();
                showToast("Moved");
              }
            })
            .catch(function (err) {
              diffEl.textContent = "error: " + err;
            });
          return;
        }

        if (data.type === "computed-style-result") {
          var pending = pendingVerifications[data.requestId];
          if (pending) {
            delete pendingVerifications[data.requestId];
            pending({ matches: data.matches, actual: data.actual });
          }
          return;
        }

        if (data.type === "rect-result") {
          var pendingRect = pendingRectRequests[data.requestId];
          if (pendingRect) {
            delete pendingRectRequests[data.requestId];
            pendingRect(data.rect);
          }
          return;
        }

        if (data.type === "computed-result") {
          var pendingComputed = pendingComputedRequests[data.requestId];
          if (pendingComputed) {
            delete pendingComputedRequests[data.requestId];
            pendingComputed(data.computed);
          }
          return;
        }

        if (data.type === "inline-text-committed") {
          mutateText(data.value);
          return;
        }

        if (data.type === "delete-key") {
          deleteSelectedElement();
          return;
        }

        if (data.type !== "select") return;
        updateSelectionOverlay(data.rect);
        resolveSelection(data.component, data.route, data.path, data.elementTag, data.computedStyle);
      });

      // Post-write half of the external-CSS safety net (see host.ts's
      // crossCheckAgainstComputed for the pre-write half, and project
      // memory `reframe-stress-test-responsive-css` for why this exists —
      // ReFrame previously reported a padding edit as successful while the
      // rendered page never changed). Asks preload.js to re-read the same
      // DOM node's computed style after giving HMR a moment to settle, and
      // compares it against the value the edit actually intended.
      var pendingVerifications = {};
      var verifyRequestCounter = 0;
      function verifyComputedStyleOnce(property, kind, expected) {
        return new Promise(function (resolve) {
          var requestId = "v" + verifyRequestCounter++;
          var timeoutId = setTimeout(function () {
            delete pendingVerifications[requestId];
            resolve({ matches: null, actual: null }); // no reply in time — don't guess a failure
          }, 3000);
          pendingVerifications[requestId] = function (result) {
            clearTimeout(timeoutId);
            resolve(result);
          };
          var iframe = document.getElementById("target");
          iframe.contentWindow.postMessage(
            { type: "reframe-verify-computed-style", requestId: requestId, property: property, kind: kind, expected: expected },
            "*",
          );
        });
      }

      var pendingRectRequests = {};
      var rectRequestCounter = 0;
      function requestFreshRect() {
        return new Promise(function (resolve) {
          var requestId = "r" + rectRequestCounter++;
          var timeoutId = setTimeout(function () {
            delete pendingRectRequests[requestId];
            resolve(null);
          }, 1500);
          pendingRectRequests[requestId] = function (rect) {
            clearTimeout(timeoutId);
            resolve(rect);
          };
          postToFrame({ type: "reframe-get-rect", requestId: requestId });
        });
      }

      var pendingComputedRequests = {};
      var computedRequestCounter = 0;
      function requestComputedStyle() {
        return new Promise(function (resolve) {
          var requestId = "c" + computedRequestCounter++;
          var timeoutId = setTimeout(function () {
            delete pendingComputedRequests[requestId];
            resolve(null);
          }, 1500);
          pendingComputedRequests[requestId] = function (computed) {
            clearTimeout(timeoutId);
            resolve(computed);
          };
          postToFrame({ type: "reframe-get-computed", requestId: requestId });
        });
      }

      // A single check isn't reliable on its own: verified live that a
      // brand-new Tailwind utility class (one that wasn't already used
      // elsewhere in the target project) can take noticeably longer than
      // React's own Fast Refresh to actually apply — Tailwind's dev-mode
      // JIT compiler has to notice the new class and inject its CSS
      // separately, which isn't on the same clock as HMR. A single ~700ms
      // check produced a false "didn't apply" warning for exactly that
      // case even though the edit was completely correct. Retrying a few
      // times with growing delays before concluding "mismatch" avoids
      // crying wolf on a slow-but-healthy edit while still catching a
      // genuine, persistent mismatch (which stays mismatched no matter how
      // many times it's re-checked).
      function verifyComputedStyleWithRetry(property, kind, expected, delays) {
        var attempt = 0;
        function tryOnce() {
          return verifyComputedStyleOnce(property, kind, expected).then(function (result) {
            if (result.matches !== false || attempt >= delays.length) return result;
            var delay = delays[attempt];
            attempt++;
            return new Promise(function (resolve) {
              setTimeout(function () {
                resolve(tryOnce());
              }, delay);
            });
          });
        }
        return tryOnce();
      }

      function appendVerificationWarning(diffEl, property, expected, kind, verifyResult) {
        if (verifyResult.matches !== false) return; // true: confirmed applied. null: couldn't verify, say nothing rather than guess.
        diffEl.textContent +=
          "\n\n⚠ Written to source, but the page didn't render the change — \"" +
          property +
          '" still shows ' +
          verifyResult.actual +
          " instead of the expected " +
          expected +
          (kind === "dimension" ? "px" : "") +
          ". This property may be controlled by something ReFrame can't see (external CSS, specificity, !important). The source change is saved — you may want to undo it.";
      }

      function mutate(property, px, backend) {
        if (!current || Number.isNaN(px)) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying " + property + " = " + px + "px (" + scope + ", " + backend + ") ...";
        fetch("/__reframe/mutate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            scope: scope,
            property: property,
            px: px,
            backend: backend,
            path: current.path || [],
            viewport: currentViewport,
            clsxArgIndex: clsxArgIndex,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) {
              refreshHistory();
              setTimeout(function () {
                verifyComputedStyleWithRetry(property, "dimension", px, [800, 1500]).then(function (verifyResult) {
                  appendVerificationWarning(diffEl, property, px, "dimension", verifyResult);
                });
              }, 700);
            }
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      function mutateColor(property, value, backend) {
        if (!current) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying " + property + " = " + value + " (" + backend + ") ...";
        fetch("/__reframe/mutate", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            scope: scope,
            property: property,
            value: value,
            backend: backend,
            path: current.path || [],
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) {
              refreshHistory();
              recordRecentColor(value); // no-op for non-hex values (var(), named colors, font stacks)
              setTimeout(function () {
                verifyComputedStyleWithRetry(property, "color", value, [800, 1500]).then(function (verifyResult) {
                  appendVerificationWarning(diffEl, property, value, "color", verifyResult);
                });
              }, 700);
            }
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      function mutateText(value) {
        if (!current) return;
        var diffEl = document.getElementById("diff");
        diffEl.textContent = "applying text edit ...";
        fetch("/__reframe/mutate-text", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: current.component,
            route: current.route,
            path: current.path || [],
            value: value,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            if (result.ok) refreshHistory();
          })
          .catch(function (err) {
            diffEl.textContent = "error: " + err;
          });
      }

      // Folds consecutive history entries touching the same element (same
      // breadcrumb + file) into one card, and within a card keeps only the
      // first beforeValue and last afterValue seen per property — so
      // "Height 48->50, then 50->44" reads as one net "Height 48px -> 44px"
      // row, matching what a developer would actually want to review.
      function groupHistoryEntries(history) {
        var groups = [];
        var lastKey = null;
        history.forEach(function (h) {
          var key = h.breadcrumb.join(" / ") + "::" + h.filePath;
          var group = key === lastKey ? groups[groups.length - 1] : null;
          if (!group) {
            group = {
              breadcrumb: h.breadcrumb,
              filePath: h.filePath,
              component: h.component,
              route: h.route,
              path: h.path,
              props: [],
              propIndex: {},
            };
            groups.push(group);
            lastKey = key;
          }
          if (Object.prototype.hasOwnProperty.call(group.propIndex, h.propertyLabel)) {
            group.props[group.propIndex[h.propertyLabel]].afterValue = h.afterValue;
          } else {
            group.propIndex[h.propertyLabel] = group.props.length;
            group.props.push({ propertyLabel: h.propertyLabel, beforeValue: h.beforeValue, afterValue: h.afterValue });
          }
        });
        return groups.reverse();
      }

      function refreshHistory() {
        return fetch("/__reframe/history")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            document.getElementById("btn-undo").disabled = data.history.length === 0;
            document.getElementById("btn-redo").disabled = !data.canRedo;
            document.getElementById("changes-title").textContent = "Changes" + (data.pendingCount > 0 ? " · " + data.pendingCount : "");
            document.getElementById("btn-review").disabled = data.pendingCount === 0;

            var body = document.getElementById("changes-body");
            if (data.history.length === 0) {
              body.innerHTML = '<div class="empty">No edits yet.</div>';
              return;
            }
            body.innerHTML = groupHistoryEntries(data.history)
              .map(function (g) {
                var rows = g.props
                  .map(function (p) {
                    return (
                      '<div class="change-prop"><span class="prop-label">' +
                      escapeHtml(p.propertyLabel) +
                      '</span><span class="prop-value">' +
                      escapeHtml(p.beforeValue) +
                      " → " +
                      escapeHtml(p.afterValue) +
                      "</span></div>"
                    );
                  })
                  .join("");
                return (
                  '<div class="change-group" title="Click to select this element on the canvas" data-component="' +
                  escapeHtml(g.component) +
                  '" data-route="' +
                  escapeHtml(g.route) +
                  '" data-path="' +
                  escapeHtml(JSON.stringify(g.path || [])) +
                  '"><div class="change-breadcrumb">' +
                  g.breadcrumb.map(escapeHtml).join(" / ") +
                  "</div>" +
                  rows +
                  '<div class="file">' +
                  escapeHtml(g.filePath) +
                  "</div></div>"
                );
              })
              .join("");
          });
      }

      function undoOrRedo(kind) {
        fetch("/__reframe/" + kind, { method: "POST" })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            var diffEl = document.getElementById("diff");
            diffEl.textContent = result.ok ? result.diff || "(no textual change)" : "error: " + result.error;
            refreshHistory();
            if (result.ok && current) resolveSelection(current.component, current.route, current.path);
          });
      }

      document.getElementById("btn-undo").addEventListener("click", function () {
        undoOrRedo("undo");
      });
      document.getElementById("btn-redo").addEventListener("click", function () {
        undoOrRedo("redo");
      });

      // Review diff panel — the "would I willingly submit this diff?" trust
      // surface. Squashes every still-pending edit per file (server-side, via
      // /__reframe/review) so reviewing several small edits to the same
      // element reads as one clean diff, not one hunk per property change.
      function showReviewPanel() {
        fetch("/__reframe/review")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            var filesEl = document.getElementById("review-files");
            var addedLines = 0;
            var removedLines = 0;
            filesEl.innerHTML = data.files
              .map(function (f) {
                var lines = f.diff.split("\n");
                lines.forEach(function (line) {
                  if (line.indexOf("+++") === 0 || line.indexOf("---") === 0) return;
                  if (line.charAt(0) === "+") addedLines++;
                  else if (line.charAt(0) === "-") removedLines++;
                });
                return (
                  '<div class="file-diff"><div class="file-name">' +
                  escapeHtml(f.filePath) +
                  "</div><pre>" +
                  escapeHtml(f.diff || "(no textual change)") +
                  "</pre></div>"
                );
              })
              .join("");
            document.getElementById("review-summary").innerHTML =
              "✓ " +
              data.files.length +
              (data.files.length === 1 ? " file" : " files") +
              "<br>✓ " +
              (addedLines + removedLines) +
              " lines changed" +
              "<br>✓ Only what you edited — nothing else touched";
            document.getElementById("changes-body").style.display = "none";
            document.getElementById("btn-review").style.display = "none";
            document.getElementById("review-panel").style.display = "block";
          });
      }

      function hideReviewPanel() {
        document.getElementById("review-panel").style.display = "none";
        document.getElementById("changes-body").style.display = "";
        document.getElementById("btn-review").style.display = "";
      }

      // Bidirectional nav: clicking a Changes card jumps the canvas back to
      // the exact element it describes — the same call a Pages-tree click
      // already makes, just fed from a history entry's component/route/path
      // instead of a tree row's data attributes. Delegated on the
      // never-replaced #changes-body container since its innerHTML (the
      // cards themselves) gets fully rebuilt on every refreshHistory().
      document.getElementById("changes-body").addEventListener("click", function (event) {
        var card = event.target.closest(".change-group");
        if (!card) return;
        var component = card.getAttribute("data-component");
        var route = card.getAttribute("data-route");
        var path = JSON.parse(card.getAttribute("data-path") || "[]");
        if (component && typeof route === "string") selectFromTree(route, component, path);
      });

      document.getElementById("btn-review").addEventListener("click", showReviewPanel);
      document.getElementById("btn-review-back").addEventListener("click", hideReviewPanel);

      document.getElementById("btn-review-keep").addEventListener("click", function () {
        fetch("/__reframe/keep", { method: "POST" })
          .then(function (r) {
            return r.json();
          })
          .then(function () {
            hideReviewPanel();
            refreshHistory();
          });
      });

      document.getElementById("btn-review-undo").addEventListener("click", function () {
        fetch("/__reframe/discard-pending", { method: "POST" })
          .then(function (r) {
            return r.json();
          })
          .then(function () {
            hideReviewPanel();
            refreshHistory().then(function () {
              if (current) resolveSelection(current.component, current.route, current.path);
            });
          });
      });

      window.addEventListener("keydown", function (event) {
        var mod = event.metaKey || event.ctrlKey;
        if (mod && event.key.toLowerCase() === "z") {
          event.preventDefault();
          undoOrRedo(event.shiftKey ? "redo" : "undo");
          return;
        }
        if (mod && event.key.toLowerCase() === "d" && canDuplicateCurrent()) {
          event.preventDefault();
          duplicateSelectedElement();
          return;
        }
      });

      Array.prototype.forEach.call(document.querySelectorAll(".reframe-handle"), function (el) {
        el.addEventListener("mousedown", function (event) {
          startDrag(el.getAttribute("data-handle"), event);
        });
      });

      // Collapsible Pages/Properties panels — the website in the canvas is
      // the product; the surrounding chrome should be able to get out of
      // the way, not compete with it for space by default.
      Array.prototype.forEach.call(document.querySelectorAll(".panel-toggle"), function (btn) {
        btn.addEventListener("click", function () {
          var panel = document.getElementById(btn.getAttribute("data-panel"));
          var collapsed = panel.classList.toggle("collapsed");
          btn.textContent = collapsed ? (btn.getAttribute("data-panel") === "tree" ? "›" : "‹") : btn.getAttribute("data-panel") === "tree" ? "‹" : "›";
        });
      });

      loadTree();
      refreshHistory();
    </script>
  </body>
</html>
