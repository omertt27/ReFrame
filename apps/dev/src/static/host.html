<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReFrame</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: #0b0b0d;
        color: #f5f5f5;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {

        flex: none;
        display: flex;
        align-items: center;

      .undo-controls {

      .layout {

      }
      #tree {

      #tree.collapsed {

      }
      #tree.collapsed #tree-body {

      }
      #tree.collapsed .panel-header h2 {

      }
      .panel-header {
        display: flex;
        align-items: center;

        gap: 6px;
      }
      .panel-header h2 {

      .panel-toggle {
        flex: none;
        background: none;
        border: 1px solid #2a2a2e;
        color: #8a8a90;
        border-radius: 5px;
        width: 22px;
        height: 22px;

      .panel-toggle:hover {

        border-color: #444;
      }
      #canvas {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* Friendly, transient confirmation for an action that already
         happened (a drag-drop reorder) — "Moved" is what a person actually
         wants to know, not the raw diff/reparenting mechanics underneath
         (still visible in the Properties panel's "Last diff" for anyone who
         wants it). Shown via the .visible class (see showToast), which
         triggers the opacity/transform transition; hidden again by removing
         it after a short delay. */
      #reframe-toast {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translate(-50%, -8px);
        background: #1c1c1f;
        border: 1px solid #333;
        color: #f5f5f5;
        font-size: 13px;
        padding: 7px 14px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease;
        z-index: 50;
      }
      #reframe-toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #viewport-switcher {
        flex: none;
        display: flex;
        justify-content: center;
        gap: 4px;
        padding: 8px;
        background: #111113;
        border-bottom: 1px solid #222;
      }
      .viewport-btn {
        background: none;
        border: 1px solid transparent;
        color: #8a8a90;
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .viewport-btn:hover {
        color: #d0d0d3;
        background: #1a1a1d;
      }
      .viewport-btn.active {
        color: #f5f5f5;
        background: #1c1c1f;
        border-color: #333;
      }
      /* Fills #canvas below the switcher; scrolls both axes when a fixed
         device frame is taller/narrower than the available space,
         matching a real devtools-style device preview — the iframe
         renders at the device's TRUE pixel width, never a scaled-down
         visual approximation, so CSS media queries inside it evaluate
         exactly as they would on a real device that size. This applies to
         "Desktop" too, not just Tablet/Mobile — it's a fixed 1440px
         frame, not "whatever's left of the browser window" (that was
         this file's own first-draft assumption, not what accurate
         responsive editing needs: readResponsiveProperty's cascade math
         in packages/core assumes a specific reference width per tier,
         and a fluid desktop width silently disagreed with it — caught
         live by the external-CSS safety net reporting a real mismatch
         between the predicted and actually-rendered value at desktop
         width, exactly the kind of bug that check exists to catch). */
      #canvas-frame-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: auto;
        display: flex;
        /* NOT centered: `justify-content:center` on an overflowing flex
           container makes the browser's own overflow/scroll-anchoring
           put the frame's left edge at a NEGATIVE scroll position by
           default (verified live: getBoundingClientRect().x was -50 with
           scrollLeft at its default 0) — surprising and hard to reason
           about. Left-aligned means scrollLeft:0 always means exactly
           "the device frame's own left edge," simple and predictable,
           same as how a real devtools device-preview pane behaves (it
           doesn't center a fixed-width frame either). */
        justify-content: flex-start;
        background: #0b0b0d;
      }
      iframe {
        flex: none;
        width: 1440px;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #canvas-frame-wrap.viewport-tablet iframe {
        width: 768px;
        height: 1024px;
        margin-top: 16px;
        box-shadow: 0 0 0 1px #222;
      }
      #canvas-frame-wrap.viewport-mobile iframe {
        width: 390px;
        height: 844px;
        margin-top: 16px;
        box-shadow: 0 0 0 1px #222;
      }
      /* Positioned directly over the selected element, in the SAME
         viewport coordinate space #canvas's other absolute children use
         (canvas's own top-left, i.e. the iframe's top-left since the
         iframe is #canvas's only flex child) — see updateSelectionOverlay.
         pointer-events:none on the outline itself so it never blocks
         clicking through to the real page underneath; only the handles
         are interactive. */
      #selection-overlay {
        position: absolute;
        border: 1.5px solid #6366f1;
        pointer-events: none;
        box-sizing: border-box;
        display: none;
      }
      /* Round, white-filled handle with a colored ring — every handle
         rendered is a REAL, working drag target (right edge = width,
         bottom edge = height, corner = both); none are decorative. A
         handle that looks draggable but silently does nothing on release
         would be its own small silent-failure, the exact thing this
         project's whole editing model refuses to do elsewhere. */
      .reframe-handle {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #fff;
        border: 2px solid #6366f1;
        border-radius: 50%;
        pointer-events: auto;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      }
      .handle-e {
        right: -6px;
        top: 50%;
        margin-top: -6px;
        cursor: ew-resize;
      }
      .handle-s {
        bottom: -6px;
        left: 50%;
        margin-left: -6px;
        cursor: ns-resize;
      }
      .handle-se {
        right: -6px;
        bottom: -6px;
        cursor: nwse-resize;
      }
      /* Follows the selected element (repositioned in updateCanvasToolbar,
         called whenever a new selection resolves) — the primary way to
         edit becomes "click element, click a button right next to it,"
         not "click element, look across the screen at a side panel." The
         side panel stays as the full/advanced inspector, not the main
         interaction surface. */
      /* Light/white pill, unlike the rest of the (still dark) app chrome —
         this is the one surface you're looking at WHILE editing, directly
         over the canvas, so it gets the Canva-reference treatment; the
         side panels stay dark dev-tool chrome deliberately, see the
         reframe-toolbar-inline-controls / wix-canva-analysis project
         memory for why the toolbar itself was already the right target. */
      #canvas-toolbar {
        position: absolute;
        display: none;
        gap: 2px;
        background: #ffffff;
        border: 1px solid #e5e5ea;
        border-radius: 12px;
        padding: 4px;
        box-shadow:
          0 6px 20px rgba(20, 20, 30, 0.15),
          0 1px 3px rgba(20, 20, 30, 0.08);
        z-index: 5;
      }
      .toolbar-btn {
        background: none;
        border: none;
        color: #4a4a52;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .toolbar-btn:hover {
        background: #f2f2f7;
        color: #1c1c1f;
      }
      .toolbar-btn.active {
        background: rgba(99, 102, 241, 0.12);
        color: #6366f1;
      }
      .toolbar-btn .icon {
        font-size: 13px;
      }
      .toolbar-btn-delete {
        margin-left: 4px;
        padding-left: 8px;
        border-left: 1px solid #e5e5ea;
        color: #8a8a90;
      }
      .toolbar-btn-delete:hover {
        background: rgba(239, 68, 68, 0.08);
        color: #dc2626;
      }
      .toolbar-sep {
        width: 1px;
        align-self: stretch;
        background: #e5e5ea;
        margin: 3px 2px;
      }
      /* The most-reached-for control (font size) shown directly in the
         toolbar, not behind a button-then-popup step — the whole point of
         this redesign: one click to CHANGE something, not one click to
         reveal the control and a second to use it. */
      .toolbar-stepper {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 2px;
      }
      /* Base .stepper-btn/.stepper-value stay dark-on-dark below — they're
         also the base the sidebar's .number-input-row steppers extend
         (border/background only, not color), so recoloring the base itself
         would silently break the (deliberately still-dark) side panel's
         steppers. The toolbar's own font-size stepper gets its light
         colors from the scoped #canvas-toolbar rule right after. */
      .stepper-btn {
        background: none;
        border: none;
        color: #d0d0d3;
        width: 20px;
        height: 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      .stepper-btn:hover {
        background: #2a2a2e;
        color: #fff;
      }
      #canvas-toolbar .stepper-btn {
        color: #4a4a52;
      }
      #canvas-toolbar .stepper-btn:hover {
        background: #f2f2f7;
        color: #1c1c1f;
      }
      .stepper-value {
        font-size: 12px;
        color: #1c1c1f;
        min-width: 26px;
        text-align: center;
      }
      /* A round color preview, not an icon+label — clicking it opens a
         one-field popup directly (no "Color" group button in between). */
      .toolbar-swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid #d8d8de;
        cursor: pointer;
        padding: 0;
        flex: none;
      }
      .toolbar-swatch:hover {
        border-color: #a0a0a8;
      }
      .toolbar-swatch.empty {
        background: repeating-conic-gradient(#e5e5ea 0% 25%, #ffffff 0% 50%) 50% / 8px 8px;
      }
      .toolbar-swatch.active {
        border-color: #6366f1;
      }
      /* Spawned directly from the (now light) toolbar — same surface, so
         it gets the same light treatment. Its field/input styling is
         SHARED with the (still-dark) sidebar via propertyField/colorField
         generating identical markup for both — scoped under #canvas-popup
         below rather than changed at the base .field/.field input level,
         same reasoning as the stepper-btn scoping above. */
      #canvas-popup {
        position: absolute;
        display: none;
        width: 240px;
        background: #ffffff;
        border: 1px solid #e5e5ea;
        border-radius: 12px;
        padding: 14px;
        box-shadow:
          0 10px 28px rgba(20, 20, 30, 0.18),
          0 2px 6px rgba(20, 20, 30, 0.08);
        z-index: 6;
      }
      #canvas-popup .field:last-child {
        margin-bottom: 0;
      }
      #canvas-popup .field label {
        color: #6b6b75;
      }
      #canvas-popup .field input,
      #canvas-popup .field textarea {
        background: #f7f7fa;
        border: 1px solid #e2e2e8;
        color: #1c1c1f;
      }
      #canvas-popup .field .unavailable {
        color: #9a9aa2;
      }
      #canvas-popup .color-input-row input[type="color"] {
        border-color: #e2e2e8;
      }
      .color-swatch-input.swatch-unresolved {
        outline: 2px dashed #f4a340;
        outline-offset: 1px;
      }
      #canvas-popup .color-input-row select.font-preset-select {
        background: #f7f7fa;
        border: 1px solid #e2e2e8;
        color: #1c1c1f;
      }
      #canvas-popup .recent-color-swatch {
        border-color: #e2e2e8;
      }
      #canvas-popup .number-input-row .stepper-btn {
        border: 1px solid #e2e2e8;
        background: #f7f7fa;
        color: #4a4a52;
      }
      #canvas-popup .number-input-row .stepper-btn:hover {
        background: #eeeef2;
        color: #1c1c1f;
      }
      #canvas-popup .empty {
        color: #9a9aa2;
      }
      #properties {
        width: 320px;
        flex: none;
        overflow: auto;
        background: #111113;
        border-left: 1px solid #222;
        padding: 16px;
        transition: width 0.15s ease;

      #properties.collapsed {

        overflow: hidden;
      }
      #properties.collapsed .panel-content {

      }
      #properties.collapsed .panel-header h2 {
        display: none;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a8a90;
        margin: 0 0 10px;
      }
      .page-group {
        margin-bottom: 14px;
      }
      .page-item {
        margin-bottom: 2px;
      }
      .group-label {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 6px;
        border-radius: 6px;
        color: #d0d0d3;
        cursor: pointer;
        display: flex;
        align-items: center;

      }
      .group-label:hover {

      }
      .group-arrow {

      .group-children {

      .page-label {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 6px;
        border-radius: 6px;
        color: #d0d0d3;
        cursor: pointer;
      }
      .page-label:hover {

      .change-group .file {

        font-size: 10px;
        margin-top: 4px;
      }
      #btn-review,
      #btn-review-undo,
      #btn-review-keep {
        background: #1c1c1f;
        color: #d0d0d3;
        border: 1px solid #2a2a2e;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #btn-review:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #btn-review-keep.primary {
        background: #f4a340;
        color: #17171a;
        border-color: #f4a340;
        font-weight: 600;
      }
      .review-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .review-summary {
        font-size: 12px;
        color: #8a8a90;
        margin-top: 10px;
        line-height: 1.6;
      }
      #review-files .file-diff {
        margin-bottom: 12px;
      }
      #review-files .file-name {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .link-btn {
        background: none;
        border: none;
        color: #8a8a90;
        font-size: 12px;
        cursor: pointer;
        padding: 8px 0 0;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <svg class="logo" viewBox="0 0 100 100" width="22" height="22" fill="none" aria-label="ReFrame">
          <path d="M10,38 L10,10 L38,10" stroke="#f4a340" stroke-width="10" stroke-linecap="square"/>
          <path d="M62,90 L90,90 L90,62" stroke="#f4a340" stroke-width="10" stroke-linecap="square"/>
        </svg>
        <div class="undo-controls">
          <button id="btn-undo" disabled title="Cmd/Ctrl+Z">Undo</button>
          <button id="btn-redo" disabled title="Cmd/Ctrl+Shift+Z">Redo</button>
        </div>
      </header>
      <div class="layout">
        <div id="tree">
          <div class="panel-header"><h2>Pages</h2><button class="panel-toggle" data-panel="tree" title="Collapse">‹</button></div>
          <div id="tree-body"></div>
        </div>
        <div id="canvas">
          <div id="viewport-switcher">
            <button class="viewport-btn active" data-viewport="desktop" title="Desktop (fills available space)">
              <span class="icon">🖥</span>Desktop
            </button>
            <button class="viewport-btn" data-viewport="tablet" title="Tablet (768px)"><span class="icon">▣</span>Tablet</button>
            <button class="viewport-btn" data-viewport="mobile" title="Mobile (390px)"><span class="icon">📱</span>Mobile</button>
          </div>
          <div id="canvas-frame-wrap">
            <iframe id="target" src="__PROXY_URL__"></iframe>
            <div id="selection-overlay">
              <div class="reframe-handle handle-e" data-handle="e" title="Drag to resize width"></div>
              <div class="reframe-handle handle-s" data-handle="s" title="Drag to resize height"></div>
              <div class="reframe-handle handle-se" data-handle="se" title="Drag to resize"></div>
            </div>
            <div id="canvas-toolbar"></div>
            <div id="canvas-popup"></div>
          </div>
          <div id="reframe-toast"></div>
        </div>
        <div id="properties">
          <div class="panel-header"><button class="panel-toggle" data-panel="properties" title="Collapse">›</button><h2>Properties</h2></div>
          <div class="panel-content">
            <div id="properties-body">
              <div class="empty">Click something in the canvas, or select it from Pages.</div>
            </div>
            <h2 style="margin-top: 24px">Last action</h2>
            <pre id="diff">(no edit yet)</pre>
            <div class="changes-header-row" style="margin-top: 24px">
              <h2 id="changes-title">Changes</h2>
              <button id="btn-review" disabled>Review diff</button>
            </div>
            <div id="changes-body">
              <div class="empty">No edits yet.</div>
            </div>
            <div id="review-panel" style="display: none">
              <div id="review-files"></div>
              <div id="review-summary" class="review-summary"></div>
              <div class="review-actions">
                <button id="btn-review-undo">Undo</button>
                <button id="btn-review-keep" class="primary">Keep changes</button>
              </div>
              <button id="btn-review-back" class="link-btn">‹ Back to changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var current = null; // { component, route, usageCount, kind, availableInstance }
      var scope = "all";
      var clsxArgIndex = null; // which clsx()/cn() argument a write should target — see scopeChoice.kind === "clsx"

      // Direct on-canvas resize: the overlay + its 3 handles track the
      // selected element's rect (sent alongside every `select` message);
      // dragging streams a live, purely visual preview into the target
      // page via postMessage (preload.js applies it as a temporary
      // !important inline override, restored on release) and commits
      // through the SAME mutate() a manually-typed sidebar number uses —
      // one write, one diff, one undo step, on mouseup. Known simplification:
      // the overlay's rect is a snapshot from selection time and doesn't
      // track iframe scroll/in-app navigation — acceptable for v1, matches
      // this model's existing "approximate, never guess at a write" bar
      // (the write itself always uses the real, freshly-computed value,
      // only the on-screen handle position can go stale).
      var lastRect = null;
      var dragState = null;
      var currentViewport = "desktop";

      // Switching device tier resizes the iframe to the device's TRUE
      // pixel width/height (never a scaled visual approximation, so CSS
      // media queries inside it evaluate exactly as a real device that
      // size would) and re-resolves whatever's currently selected — the
      // EFFECTIVE value of a responsive Tailwind property genuinely
      // differs per tier (see packages/core's readResponsiveProperty), so
      // the panel has to ask again, not just relabel what it already has.
      // computedStyle is deliberately omitted on this re-resolve — the
      // value captured at the OLD viewport width would produce a false
      // mismatch warning against the NEW one; same precedent as the
      // existing post-undo/redo re-resolve below, which never had a live
      // computedStyle to send either.
      Array.prototype.forEach.call(document.querySelectorAll(".viewport-btn"), function (btn) {
        btn.addEventListener("click", function () {
          var tier = btn.getAttribute("data-viewport");
          if (tier === currentViewport) return;
          currentViewport = tier;
          Array.prototype.forEach.call(document.querySelectorAll(".viewport-btn"), function (b) {
            b.classList.toggle("active", b === btn);
          });
          var wrap = document.getElementById("canvas-frame-wrap");
          wrap.classList.remove("viewport-tablet", "viewport-mobile");
          if (tier === "tablet") wrap.classList.add("viewport-tablet");
          if (tier === "mobile") wrap.classList.add("viewport-mobile");

          closeCanvasToolbar();
          if (!current) return;
          // Give the iframe a moment to actually reflow at its new size
          // before asking for a fresh rect.
          setTimeout(function () {
            requestFreshRect().then(function (rect) {
              updateSelectionOverlay(rect);
              resolveSelection(current.component, current.route, current.path);
            });
          }, 60);
        });
      });

      // `rect` (from preload.js) is always IFRAME-viewport-relative. Every
      // absolutely-positioned overlay element lives in #canvas-frame-wrap,
      // not directly against the iframe's own top-left — true once the
      // device-preview modes exist at all (a centered, narrower-than-its-
      // container tablet/mobile frame has a real horizontal offset), and
      // more correct in desktop mode too even though that offset happens
      // to be zero there. Added to every rect coordinate before using it
      // for positioning, never for sizing (width/height need no offset).
      function iframeOffset() {
        var iframe = document.getElementById("target");
        var wrap = document.getElementById("canvas-frame-wrap");
        var iframeRect = iframe.getBoundingClientRect();
        var wrapRect = wrap.getBoundingClientRect();
        return { x: iframeRect.left - wrapRect.left, y: iframeRect.top - wrapRect.top };
      }

      function updateSelectionOverlay(rect) {
        var overlay = document.getElementById("selection-overlay");
        if (!rect) {
          overlay.style.display = "none";
          lastRect = null;
          return;
        }
        lastRect = rect;
        var offset = iframeOffset();
        overlay.style.left = rect.x + offset.x + "px";
        overlay.style.top = rect.y + offset.y + "px";
        overlay.style.width = rect.width + "px";
        overlay.style.height = rect.height + "px";
        overlay.style.display = "block";
      }

      var toastTimer = null;
      function showToast(text) {
        var toast = document.getElementById("reframe-toast");
        toast.textContent = text;
        toast.classList.add("visible");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("visible");
        }, 1400);
      }

      function propAvailable(key) {
        return !!(
          current &&
          current.properties &&
          current.properties.editable &&
          current.properties.values[key] &&
          current.properties.values[key].available
        );
      }

      function propBackend(key) {
        return current && current.properties && current.properties.values[key] ? current.properties.values[key].backend : undefined;
      }

      function postToFrame(msg) {
        var iframe = document.getElementById("target");
        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(msg, "*");
      }

      function updateFieldValue(property, px) {
        var input = document.querySelector('input[data-property="' + property + '"]');
        if (input) input.value = px;
      }

      function handleInvolves(handle, axis) {
        if (axis === "width") return handle === "e" || handle === "se";
        return handle === "s" || handle === "se";
      }

      function startDrag(handleType, event) {
        if (!lastRect || !current) return;
        var wantsWidth = handleInvolves(handleType, "width") && propAvailable("width");
        var wantsHeight = handleInvolves(handleType, "height") && propAvailable("height");
        if (!wantsWidth && !wantsHeight) return; // neither axis this handle touches is editable here
        dragState = {
          handle: handleType,
          startX: event.clientX,
          startY: event.clientY,
          startWidth: lastRect.width,
          startHeight: lastRect.height,
          wantsWidth: wantsWidth,
          wantsHeight: wantsHeight,
        };
        event.preventDefault();
        // The moment the cursor crosses over the iframe's own rendered
        // area mid-drag, mousemove stops reaching this document's listener
        // — an iframe is a separate browsing context, so the browser
        // routes pointer events into ITS document instead of bubbling them
        // to the parent. Disabling pointer-events on the iframe for the
        // duration of the drag keeps every move event on this page, where
        // the drag logic actually lives; restored in onDragEnd regardless
        // of how the drag ends.
        document.getElementById("target").style.pointerEvents = "none";
        document.addEventListener("mousemove", onDragMove);
        document.addEventListener("mouseup", onDragEnd);
      }

      function onDragMove(event) {
        if (!dragState) return;
        var dx = event.clientX - dragState.startX;
        var dy = event.clientY - dragState.startY;
        var overlay = document.getElementById("selection-overlay");
        if (dragState.wantsWidth) {
          dragState.currentWidth = Math.max(4, Math.round(dragState.startWidth + dx));
          overlay.style.width = dragState.currentWidth + "px";
          postToFrame({ type: "reframe-preview-style", property: "width", px: dragState.currentWidth });
        }
        if (dragState.wantsHeight) {
          dragState.currentHeight = Math.max(4, Math.round(dragState.startHeight + dy));
          overlay.style.height = dragState.currentHeight + "px";
          postToFrame({ type: "reframe-preview-style", property: "height", px: dragState.currentHeight });
        }
      }

      function onDragEnd() {
        if (!dragState) return;
        document.removeEventListener("mousemove", onDragMove);
        document.removeEventListener("mouseup", onDragEnd);
        document.getElementById("target").style.pointerEvents = "";
        postToFrame({ type: "reframe-preview-clear" });

        if (dragState.wantsWidth && dragState.currentWidth !== undefined && dragState.currentWidth !== dragState.startWidth) {
          mutate("width", dragState.currentWidth, propBackend("width"));
          updateFieldValue("width", dragState.currentWidth);
        }
        if (dragState.wantsHeight && dragState.currentHeight !== undefined && dragState.currentHeight !== dragState.startHeight) {
          mutate("height", dragState.currentHeight, propBackend("height"));
          updateFieldValue("height", dragState.currentHeight);
        }
        dragState = null;
      }

      // One expandable row — a page/section label plus an expand arrow that
      // lazy-loads that component's "meaningful children" tree (see
      // renderElementTreeNode below) on first click, exactly like
      // .group-label/.group-children already lazy-nothing but eagerly
      // toggle — same nextElementSibling show/hide idiom, just fetching the
      // content in first instead of it already being in the DOM.
      function treeRow(route, component, labelHtml) {
        return (
          '<div class="tree-row">' +
          '<span class="tree-expand" data-route="' +
          route +
          '" data-component="' +
          component +
          '">▸</span>' +
          labelHtml +
          "</div>" +
          '<div class="element-subtree" data-route="' + route + '" data-component="' + component + '" style="display: none"></div>'
        );
      }

      // One page node — a real route, plus whatever named top-level
      // sections it composes from (rare in practice: verified live that
      // only 1 of ~50 real PrivaPDF routes had any).
      function renderPageNode(p) {
        var sections = p.sections
          .map(function (name) {
            return treeRow(p.route, name, '<div class="section-row" data-route="' + p.route + '" data-component="' + name + '">' + name + "</div>");
          })
          .join("");
        var pageLabel =
          '<div class="page-label" data-route="' +
          p.route +
          '" data-component="' +
          p.pageComponent +
          '" title="' +
          p.route +
          '">' +
          p.label +
          "</div>";
        return '<div class="page-item">' + treeRow(p.route, p.pageComponent, pageLabel) + sections + "</div>";
      }

      // Recursively renders one ElementTreeNode (see packages/core's
      // buildElementTree) — a friendly-named row, plus its own children
      // nested inline (already fetched in one call, so no further lazy
      // loading needed at deeper levels) behind their own expand arrow. A
      // component-boundary node never gets an arrow: its internals belong
      // to its own definition, not this component's tree.
      function renderElementTreeNode(node) {
        var pathAttr = node.path.join(",");
        var hasChildren = !node.isComponent && node.children && node.children.length > 0;
        var label = friendlyElementName(node.tag) + (node.isComponent ? ' <span class="element-tag-hint">· component</span>' : "");
        var row =
          '<div class="tree-row">' +
          (hasChildren ? '<span class="tree-expand" data-element-path="' + pathAttr + '">▸</span>' : '<span class="tree-expand-spacer"></span>') +
          '<div class="element-row" data-path="' + pathAttr + '">' + label + "</div>" +
          "</div>";
        var childrenHtml = hasChildren
          ? '<div class="element-children" data-element-path="' + pathAttr + '" style="display: none">' +
            node.children.map(renderElementTreeNode).join("") +
            "</div>"
          : "";
        return '<div class="element-node" style="padding-left: 12px">' + row + childrenHtml + "</div>";
      }

      // A group exists ONLY because 2+ real routes share a first path
      // segment (see host.ts's buildPageTree) — never a hand-authored
      // second hierarchy. Collapsed by default: a project can have dozens
      // of pages under one segment (verified live: PrivaPDF's real
      // /guides/* alone is 30+ pages) and showing all of them open by
      // default would defeat the point of grouping them at all.
      function renderGroupNode(g) {
        return (
          '<div class="page-group"><div class="group-label"><span class="group-arrow">▸</span>' +
          g.label +
          "</div>" +
          '<div class="group-children" style="display: none">' +
          g.children.map(renderPageNode).join("") +
          "</div></div>"
        );
      }

      function loadTree() {
        fetch("/__reframe/tree")
          .then(function (r) {
            return r.json();
          })
          .then(function (nodes) {
            var body = document.getElementById("tree-body");
            body.innerHTML = nodes
              .map(function (n) {
                return n.kind === "group" ? renderGroupNode(n) : renderPageNode(n);
              })
              .join("");

            Array.prototype.forEach.call(body.querySelectorAll(".group-label"), function (el) {
              el.addEventListener("click", function () {
                var children = el.nextElementSibling;
                var open = children.style.display !== "none";
                children.style.display = open ? "none" : "block";
                el.querySelector(".group-arrow").textContent = open ? "▸" : "▾";
              });
            });
            // The page label itself navigates to that page and selects its
            // own root component — previously only the .section-row
            // entries (top-level named sub-components a page happens to
            // compose from) were clickable at all, and most real pages
            // have none: a page written as one big function has zero
            // sections, leaving nothing in this list to click. Verified
            // live against PrivaPDF's real Pages list: only "Convert" had
            // any section-row at all among ~25 real routes.
            Array.prototype.forEach.call(body.querySelectorAll(".page-label"), function (el) {
              el.addEventListener("click", function () {
                selectFromTree(el.getAttribute("data-route"), el.getAttribute("data-component"), []);
              });
            });
            Array.prototype.forEach.call(body.querySelectorAll(".section-row"), function (el) {
              el.addEventListener("click", function () {
                selectFromTree(el.getAttribute("data-route"), el.getAttribute("data-component"), []);
              });
            });

            // A single delegated listener handles every expand arrow (both
            // the top-level page/section one, which lazy-fetches
            // /__reframe/element-tree on first open, and the nested ones
            // inside an already-fetched tree, which just toggle) and every
            // nested element row's click-to-select — new subtree markup
            // keeps arriving after this listener is attached, so delegation
            // avoids re-wiring on every fetch.
            body.addEventListener("click", function (e) {
              var expand = e.target.closest(".tree-expand");
              if (expand) {
                var target = expand.closest(".tree-row").nextElementSibling;
                var isOpen = target.style.display !== "none";
                if (isOpen) {
                  target.style.display = "none";
                  expand.textContent = "▸";
                  return;
                }
                target.style.display = "block";
                expand.textContent = "▾";
                if (!expand.hasAttribute("data-element-path") && !target.dataset.loaded) {
                  target.dataset.loaded = "1";
                  var route = expand.getAttribute("data-route");
                  var component = expand.getAttribute("data-component");
                  target.innerHTML = '<div class="empty" style="padding-left: 12px">loading…</div>';
                  fetch("/__reframe/element-tree", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ component: component }),
                  })
                    .then(function (r) {
                      return r.json();
                    })
                    .then(function (result) {
                      if (!result.ok) {
                        target.innerHTML = '<div class="empty" style="padding-left: 12px">' + (result.error || "couldn't load") + "</div>";
                        return;
                      }
                      target.innerHTML = result.tree.length
                        ? result.tree.map(renderElementTreeNode).join("")
                        : '<div class="empty" style="padding-left: 12px">nothing nested here</div>';
                    });
                }
                return;
              }

              var elRow = e.target.closest(".element-row");
              if (elRow) {
                var container = elRow.closest(".element-subtree");
                if (!container) return;
                var elRoute = container.getAttribute("data-route");
                var elComponent = container.getAttribute("data-component");
                var elPath = elRow.getAttribute("data-path");
                Array.prototype.forEach.call(body.querySelectorAll(".element-row.active"), function (el) {
                  el.classList.remove("active");
                });
                elRow.classList.add("active");
                selectFromTree(elRoute, elComponent, elPath ? elPath.split(",").map(Number) : []);
              }
            });
          });
      }

      function selectFromTree(route, component, path) {
        var iframe = document.getElementById("target");
        var hasPath = Array.isArray(path) && path.length > 0;
        Array.prototype.forEach.call(document.querySelectorAll(".section-row, .page-label"), function (el) {
          el.classList.toggle("active", !hasPath && el.getAttribute("data-route") === route && el.getAttribute("data-component") === component);
        });
        if (hasPath) {
          // The specific .element-row was already marked active by the
          // click handler above (it has the DOM reference this function
          // doesn't) — just make sure no stale top-level row stays lit.
        } else {
          Array.prototype.forEach.call(document.querySelectorAll(".element-row.active"), function (el) {
            el.classList.remove("active");
          });
        }
        // A Pages-tree selection has no click rect at all — clear any rect
        // left over from a previous canvas click so updateCanvasToolbar
        // (called once resolve completes) correctly hides the toolbar
        // rather than anchoring it to a stale, now-unrelated position.
        updateSelectionOverlay(null);

        var proxyOrigin = new URL(iframe.src).origin;
        var currentPath = new URL(iframe.src).pathname;
        if (currentPath === route) {
          resolveSelection(component, route, path);
        } else {
          iframe.src = proxyOrigin + route;
          setTimeout(function () {
            resolveSelection(component, route, path);
          }, 900);
        }
      }

      // `path`/`elementTag` are only present when the click came from inside
      // a component (a nested JSX element), not from the Pages tree — an
      // empty/omitted path means "the component's own root", same meaning
      // as before this ever existed. `computedStyle` (the browser's actual
      // rendered values for the clicked element, from preload.js) is
      // likewise only present for a real click — a Pages-tree selection has
      // no live DOM node to read it from yet, so the server-side external-
      // CSS cross-check simply has nothing to compare against there.
      function resolveSelection(component, route, path, elementTag, computedStyle) {
        var body = document.getElementById("properties-body");
        body.innerHTML = '<div class="empty">resolving ' + component + " ...</div>";
        fetch("/__reframe/resolve", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            component: component,
            route: route,
            path: path || [],
            elementTag: elementTag || null,
            computedStyle: computedStyle || null,
            viewport: currentViewport,
          }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {
            result.component = component;
            result.route = route;
            renderProperties(result);
          })
          .catch(function (err) {
            body.innerHTML = '<div class="empty">error: ' + err + "</div>";
          });
      }

      // Which real backend an edit lands in (a Tailwind utility class vs an
      // inline style, decided per-property server-side) is real, useful
      // information — just not the FIRST thing a "click it, change it"
      // editor should show. It's on the label as a native tooltip (hover
      // to see it) instead of printed inline, matching the "ReFrame decides
      // the write, the user shouldn't have to think about it" framing —
      // still fully visible on demand, never hidden from someone who wants
      // it, just not competing with the value for attention by default.
      // Per-key stepper granularity — a plain "always step by 1" default
      // is wrong for fontWeight (100-900 in hundreds) and actively
      // destructive for lineHeight/letterSpacing, which are commonly small
      // fractional values (e.g. line-height: 1.2) where a step of 1 would
      // blow past every meaningful value in one click.
      var STEP_CONFIG = {
        fontWeight: { step: 100, min: 100, max: 900, precision: 0 },
        lineHeight: { step: 0.1, min: 0, precision: 2 },
        letterSpacing: { step: 0.5, precision: 2 },
      };
      function stepConfigFor(key) {
        return STEP_CONFIG[key] || { step: 1, min: 0, precision: 0 };
      }

      // A number field with +/- stepper buttons flanking it, not a bare
      // <input type=number> — matches the fontSize stepper already proven
      // in the floating toolbar (see stepFontSize), generalized to every
      // dimension field so "click to change it" doesn't stop being true
      // just because a control lives in the side panel or a popup instead
      // of the toolbar. The number itself stays directly editable too, for
      // anyone who wants to type an exact value.
      function propertyField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.px !== null ? prop.px : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + humanizeReason(prop.reason) + "</div>";
        // The viewport tier only means anything for a Tailwind-backed field
        // — an inline style has no responsive variant, so it always shows
        // the same single value regardless of which device tab is active.
        var tierNote = prop && prop.backend === "tailwind" && currentViewport !== "desktop" ? " · " + currentViewport : "";
        var titleAttr = prop && prop.backend ? ' title="Writes to: ' + prop.backend + tierNote + '"' : "";
        var cfg = stepConfigFor(key);
        return (
          '<div class="field">' +
          "<label" +
          titleAttr +
          ">" +
          label +
          "</label>" +
          '<div class="number-input-row">' +
          '<button type="button" class="stepper-btn" data-step-for="' +
          key +
          '" data-step-dir="-1" ' +
          (disabled ? "disabled" : "") +
          ">–</button>" +
          '<input type="number" data-property="' +
          key +
          '" data-backend="' +
          (prop && prop.backend ? prop.backend : "") +
          '" step="' +
          cfg.step +
          '"' +
          (cfg.min !== undefined && cfg.min !== null ? ' min="' + cfg.min + '"' : "") +
          (cfg.max !== undefined && cfg.max !== null ? ' max="' + cfg.max + '"' : "") +
          ' value="' +
          value +
          '" placeholder="—" ' +
          (disabled ? "disabled" : "") +
          " />" +
          '<button type="button" class="stepper-btn" data-step-for="' +
          key +
          '" data-step-dir="1" ' +
          (disabled ? "disabled" : "") +
          ">+</button>" +
          "</div>" +
          note +
          "</div>"
        );
      }

      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // The server's "reason" strings are deliberately specific and honest
      // — real engineering documentation, useful in Advanced or a bug
      // report — but "Tailwind color utilities aren't editable yet" and
      // "refusing to guess" are developer language leaking straight into
      // the main panel, exactly the "still looks like developer UX"
      // feedback this exists to fix. Pattern-matches the reasons someone
      // actually hits in normal use to a short, plain-language version;
      // anything unmatched falls back to the RAW reason rather than a
      // generic "not editable" — never hides information this project's
      // whole editing model is built around surfacing honestly, just
      // improves it where a good plain-language version is known.
      var REASON_PATTERNS = [
        [/mixed content/i, "This text is mixed with other elements, so it can't be edited directly here."],
        [/no text content here/i, "There's no text to edit here."],
        [/no editable style found|no className or style found/i, "Nothing here is set up to be edited yet."],
        [/no inline style on this element to add a color/i, "Color isn't set on this element yet."],
        [/already set via a tailwind utility class/i, "This color is already set a different way — not editable here yet."],
        [/already set via a more specific utility/i, "This spacing is split across multiple sides — one combined control isn't available for that yet."],
        [/the source predicts .* but the page actually renders/i, "Something else on the page is overriding this, so it's not safely editable here."],
        [/is inline — css ignores width and height/i, "This element can't be resized — inline elements ignore width and height."],
        [/is set to a non-numeric string.*not a plain px dimension/i, "This value isn't a plain number, so it can't be edited with this control."],
        [/looks like a multi-value shorthand/i, "This spacing has different values per side — one combined control isn't supported for that yet."],
        [/value isn.t a numeric or plain string literal/i, "This value is computed dynamically, so it can't be edited here."],
        [/style value isn.t a plain object literal|style is unsupported/i, "This element's style isn't set up in a way that can be edited yet."],
        [/className is a template literal|classname shape isn.t/i, "This element's classes are built dynamically — not editable here yet."],
        [/not directly used in a page\/layout file/i, "This is a shared component, not tied to one specific page."],
      ];
      function humanizeReason(reason) {
        for (var i = 0; i < REASON_PATTERNS.length; i++) {
          if (REASON_PATTERNS[i][0].test(reason)) return REASON_PATTERNS[i][1];
        }
        return reason;
      }

      // A plain text input, not a native <input type=color> — that widget
      // only accepts 6-digit hex and can't represent "var(--accent)" or a
      // named color, and a preview swatch can't resolve what a CSS variable
      // evaluates to from this document anyway (it's defined in the target
      // page's own stylesheet). Shows the raw current value verbatim,
      // whatever form it's already in — same "preserve the author's
      // representation" principle as the dimension fields.
      // Expands a 3-digit hex ("#abc") to 6-digit ("#aabbcc") — the native
      // <input type=color> swatch only accepts the 6-digit form.
      function expandHex3(hex) {
        var c = hex.slice(1);

      }

      // A native OS color-picker swatch alongside the raw text field — the
      // swatch covers the common case (pick a color visually, no hex
      // knowledge needed, matching Canva/Wix); the text field stays as the
      // escape hatch for values the swatch can't represent (CSS variables,
      // named colors — see the module doc comment above on why a plain
      // <input type=color> alone isn't enough here).
      // Recently-used hex colors, persisted across reloads (localStorage) —
      // Canva's "document colors" row, so a repeat color is one click, not
      // even a trip into the OS picker. Hex only: a non-hex value (var(),
      // named) has no fixed visual swatch to show here reliably, same
      // reasoning the native picker fallback already uses.
      var RECENT_COLORS_KEY = "reframe-recent-colors";
      var RECENT_COLORS_MAX = 8;
      function loadRecentColors() {
        try {
          var raw = window.localStorage.getItem(RECENT_COLORS_KEY);
          var parsed = raw ? JSON.parse(raw) : [];

        } catch (e) {
          return [];
        }

      function recordRecentColor(value) {
        if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value)) return;

        var list = loadRecentColors().filter(function (c) {
          return c.toLowerCase() !== hex.toLowerCase();
        });
        list.unshift(hex);
        list = list.slice(0, RECENT_COLORS_MAX);
        try {
          window.localStorage.setItem(RECENT_COLORS_KEY, JSON.stringify(list));
        } catch (e) {
          // storage unavailable/full — recent colors just won't persist, not fatal
        }
      }
      function renderRecentColorSwatches(key) {
        var colors = loadRecentColors();

        return (
          '<div class="recent-colors" data-recent-for="' +
          key +
          '">' +
          colors
            .map(function (hex) {
              return (
                '<button type="button" class="recent-color-swatch" data-recent-color="' +
                hex +
                '" title="' +
                hex +
                '" style="background:' +
                hex +
                '"></button>'
              );
            })
            .join("") +
          "</div>"
        );
      }

      function colorField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.value !== null ? prop.value : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + humanizeReason(prop.reason) + "</div>";
        var titleAttr = prop && prop.backend ? ' title="Writes to: ' + prop.backend + '"' : "";
        var isHex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value);
        var pickerValue = isHex ? (value.length === 4 ? expandHex3(value) : value) : "#000000";
        // A var()/named value (e.g. "var(--accent)") can't be shown in a
        // native <input type="color"> at all — it only understands hex.
        // Silently defaulting its swatch to black looked like a real (and
        // wrong) answer sitting right next to the honest value in the text
        // field beside it — someone reported this as ReFrame "showing two
        // different colors" for the same property, which is exactly what
        // was happening. Left enabled (dragging it to pick a color is a
        // legitimate way to replace a var() with a solid one) but visually
        // marked so the swatch never reads as a confident, correct preview.
        var pickerUnresolved = value !== "" && !isHex;
        var pickerTitle = pickerUnresolved
          ? ' title="Placeholder only - this value cannot be shown as a plain color. Pick a color here to replace it with a solid one."'
          : "";
        return (
          '<div class="field">' +
          "<label" +
          titleAttr +
          ">" +
          label +
          "</label>" +
          '<div class="color-input-row">' +
          '<input type="color" class="color-swatch-input' +
          (pickerUnresolved ? " swatch-unresolved" : "") +
          '" data-color-for="' +
          key +
          '" value="' +
          pickerValue +
          '"' +
          pickerTitle +
          " " +
          (disabled ? "disabled" : "") +
          " />" +
          '<input type="text" data-property="' +
          key +
          '" data-value-kind="color" data-backend="' +
          (prop && prop.backend ? prop.backend : "") +
          '" value="' +
          escapeHtml(value) +
          '" placeholder="e.g. #3B82F6 or var(--accent)" ' +
          (disabled ? "disabled" : "") +
          " />" +
          "</div>" +
          (disabled ? "" : renderRecentColorSwatches(key)) +
          note +
          "</div>"
        );
      }

      // A curated preset dropdown alongside the raw text field — same
      // "swatch for the common case, text field as the escape hatch"
      // pattern as colorField's native picker. Choosing a preset just
      // fills the text field's value (doesn't commit by itself); the text
      // field's own change event does the actual write, same as typing.
      function fontFamilyField(key, label, prop) {
        var disabled = !prop || !prop.available;
        var value = prop && prop.available && prop.value !== null ? prop.value : "";
        var note = !prop || prop.available ? "" : '<div class="unavailable">' + humanizeReason(prop.reason) + "</div>";
        var titleAttr = prop && prop.backend ? ' title="Writes to: ' + prop.backend + '"' : "";

        for (var i = 0; i < FONT_PRESETS.length; i++) {
          options += '<option value="' + escapeHtml(FONT_PRESETS[i].value) + '">' + FONT_PRESETS[i].label + "</option>";
        }
        return (
          '<div class="field">' +
          "<label" +
          titleAttr +
          ">" +
          label +
          "</label>" +
          '<div class="color-input-row">' +
          '<select class="font-preset-select" data-font-preset-for="' +
          key +
          '" ' +
          (disabled ? "disabled" : "") +
          ">" +
          options +
          "</select>" +
          '<input type="text" data-property="' +
          key +
          '" data-value-kind="color" data-backend="' +
          (prop && prop.backend ? prop.backend : "") +
          '" value="' +
          escapeHtml(value) +
          '" placeholder="e.g. Georgia, serif or var(--serif)" ' +
          (disabled ? "disabled" : "") +
          " />" +
          "</div>" +
          note +
          "</div>"
        );
      }

      // Content is shown above the style properties — for a "click it, change
      // it" editor, the text itself is the primary edit most people reach
      // for, not padding. Only plain single-text-node elements are editable
      // here (see text-ir.ts) — mixed text+markup or `{expression}` content
      // shows the specific unsupported reason instead of a guess.
      function textField(text) {
        if (!text || !text.editable) {
          var reason = text ? text.reason : "no editable text here";
          return '<div class="field"><label>Text</label><div class="unavailable">' + humanizeReason(reason) + "</div></div>";

          '<div class="field">' +
          "<label>Text</label>" +
          '<textarea data-text-field rows="3">' +
          escapeHtml(text.value) +
          "</textarea>" +
          "</div>"
        );
      }

      // A human name for what's selected — "Heading", "Button", "Image" —
      // instead of the raw JSX tag or the component's own source name.
      // Falls back to a capitalized version of whatever tag/component name
      // is available for anything not in this list, never a blank label.
      var FRIENDLY_ELEMENT_NAMES = {
        h1: "Heading",
        h2: "Heading",
        h3: "Heading",
        h4: "Heading",
        h5: "Heading",
        h6: "Heading",
        p: "Paragraph",
        span: "Text",
        a: "Link",
        Link: "Link",
        button: "Button",
        img: "Image",
        Image: "Image",
        nav: "Navigation",
        ul: "List",
        ol: "List",
        li: "List item",
        section: "Section",
        main: "Section",
        header: "Section",
        footer: "Section",
        div: "Box",
        Box: "Box",
      };
      function friendlyElementName(tagOrComponent) {
        if (!tagOrComponent) return "Element";
        return FRIENDLY_ELEMENT_NAMES[tagOrComponent] || tagOrComponent.charAt(0).toUpperCase() + tagOrComponent.slice(1);
      }

      // Property groups, in display order — a flat list of 9 fields reads
      // as a form to fill out; grouped under plain headings it reads as
      // "what can I change about this," matching how Wix/Canva-style
      // editors present the same information. Only rendered when at least
      // one field in the group exists on this element at all (present in
      // the resolved properties, whether currently available or not) —
      // empty groups are silently skipped rather than shown "empty."
      var PROPERTY_GROUPS = [
        { title: "Typography", keys: ["fontFamily", "fontSize", "fontWeight", "lineHeight", "letterSpacing"] },
        { title: "Color", keys: ["textColor", "backgroundColor"] },
        { title: "Spacing", keys: ["padding"] },
        { title: "Size", keys: ["width", "height"] },
      ];
      var FIELD_LABELS = {
        height: "Height",
        width: "Width",
        padding: "Padding",
        textColor: "Text",
        backgroundColor: "Background",
        fontFamily: "Font",
        fontSize: "Font size",
        fontWeight: "Weight",
        lineHeight: "Line height",
        letterSpacing: "Letter spacing",
      };

      // A curated, common-and-safe list rather than an exhaustive font
      // catalog — ReFrame can't know what's actually loaded/available in
      // the target project (no font-loading/@font-face scan), so this is
      // deliberately restricted to system/web-safe stacks + the project's
      // own existing CSS custom properties are still reachable by typing
      // them directly in the text field below. Picking one here just fills
      // in the text field; nothing is committed until the field commits.
      var FONT_PRESETS = [
        { label: "System UI", value: "system-ui, sans-serif" },
        { label: "Sans-serif", value: "ui-sans-serif, Helvetica, Arial, sans-serif" },
        { label: "Serif", value: "ui-serif, Georgia, 'Times New Roman', serif" },
        { label: "Monospace", value: "ui-monospace, 'SF Mono', Menlo, monospace" },
        { label: "Georgia", value: "Georgia, serif" },
        { label: "Helvetica", value: "Helvetica, Arial, sans-serif" },
      ];

      // when this element's content is directly editable) — same keys, so
      // a toolbar button and its popup show exactly what the full panel's
      // matching section would, just one click closer to the element
      // instead of a scroll away in the side panel.
      // Everything NOT promoted to an inline control below (see
      // updateCanvasToolbar) — reachable via the toolbar's "More" button,
      // same popup mechanism as before, just for a smaller leftover set.

      // yet" case), so checking just `values[key]` truthiness was really
      // checking "does this key exist," which is always true — it let the
      // floating toolbar render a stepper/swatch for a property the server
      // had explicitly refused (available: false), and clicking it sent a
      // mutate request with no backend to write to (a 400: "expected {

      var POPUP_CONTENT = {

        backgroundColor: function () {

        more: function () {

        // included), not just the drag handles — dragging a handle you
        // can't see the exact px value on is much harder than typing one.

      // Positioned just above the selected element (below it if there's no

      // the end of every renderProperties, since which buttons make sense
      // depends on properties that only exist once resolve completes, not
      // on the raw click rect alone.
      // Deleting a component's own root doesn't make sense from a single

      // same restriction the server enforces, checked here too so the

      }

      function deleteSelectedElement() {

          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ component: current.component, route: current.route, path: current.path }),

          .then(function (r) {
            return r.json();
          })
          .then(function (result) {

          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ component: current.component, route: current.route, path: current.path }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (result) {

          });

      // Nudges fontSize by 1px directly from the toolbar — no button-then-
      // popup step for the single most-reached-for control. Each click is
      // its own write (same one-write-per-change model drag-resize and
      // every other control already use), not batched/debounced — simple
      // and predictable over clever.
      function applyFontSizeStep(next) {

        // own optimistic display in sync without a full re-resolve round trip

      }

      // element at all (inherited from a parent/browser default — px is
      // null, not 0), defaulting the stepper's baseline to 0 produced
      // fontSize:1, fontSize:2 — a tiny, nonsensical value on the first
      // couple of clicks, caught immediately by the external-CSS safety
      // net ("the page didn't render the change") since nothing renders
      // text at 2px. Never guess a baseline: ask the real browser what
      // it's actually currently rendering and nudge from there.
      function stepFontSize(delta) {
        var prop = current.properties.values.fontSize;
        if (!prop || !prop.available) return; // refuse — no backend to write to; keyAvailable should already keep this from being reachable, but never guess a mutation without one
